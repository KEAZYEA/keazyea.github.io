<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>The Keep (Demo)</title>
    <meta name="description" content="The Keep: an open-world adventure you play as your own character — a city to call home, roads full of monsters, and a story to follow. The gear you wear is your loadout.">
    <link rel="icon" href="images/KIH.jpg">
    <style>
        :root { --ink: #f3efff; --dim: #b9b2dc; --panel: rgba(18, 16, 34, 0.86); --line: rgba(255, 255, 255, 0.16); --gold: #ffd24a; --red: #ff5a6a; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { margin: 0; height: 100%; background: #0b0a14; color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
        /* no browser gestures where you play (the field, the stick, the buttons) — but menus and lists scroll as usual
           (Safari counts a parent's touch-action too, so it isn't set on the page itself) */
        #cv, .pad, .stick, .stick-hint { touch-action: none; }
        .hud-btn, .prompt button, .dialog button { touch-action: manipulation; }
        #keep { position: fixed; inset: 0; }
        #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
        button { font-family: inherit; }
        /* the HUD */
        .hud-top { position: absolute; top: calc(8px + env(safe-area-inset-top, 0px)); left: 8px; right: 8px; display: flex; align-items: center; gap: 8px; pointer-events: none; }
        .bars { display: flex; flex-direction: column; gap: 3px; padding: 5px 8px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
        .bar { display: flex; align-items: center; gap: 6px; }
        .bar-track { width: 92px; height: 9px; border-radius: 6px; overflow: hidden; }
        .bar-track i { display: block; height: 100%; width: 100%; transition: width .15s; }
        .hp-track { background: #3a1620; } .hp-track i { background: linear-gradient(90deg, #ff4f6a, #ff8a5a); }
        .mp-track { background: #14233f; } .mp-track i { background: linear-gradient(90deg, #3a8bff, #8fd8ff); }
        .xp-track { height: 5px; background: #2e2840; } .xp-track i { background: linear-gradient(90deg, #ffd24a, #fff1a8); }
        .hero-lv { margin-top: 6px; font-size: .78rem; font-weight: 800; } .hero-lv small { display: block; color: var(--dim); font-weight: 700; margin-top: 1px; }
        .bar span { font-size: .68rem; font-weight: 800; min-width: 44px; }
        /* 🎒 under the map (top-right) — the top bar's full on a phone */
        #bagBtn { position: absolute; right: 8px; top: calc(154px + env(safe-area-inset-top, 0px)); width: 46px; height: 46px; font-size: 1.35rem; border-radius: 14px; }
        body.in-lobby #bagBtn { top: calc(62px + env(safe-area-inset-top, 0px)); }
        .loot { display: flex; gap: 6px; padding: 5px 8px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); font-size: .76rem; font-weight: 800; }
        .loot span { white-space: nowrap; } .loot span[hidden] { display: none; }
        /* a narrow phone: the loot as a little 2×2 grid, so ☰ stays on screen */
        @media (max-width: 420px) { .loot { display: grid; grid-template-columns: auto auto; gap: 1px 8px; padding: 4px 8px; font-size: .7rem; } .hud-top { gap: 6px; } }
        .loot b { margin-left: 2px; }
        .hud-btn { pointer-events: auto; margin-left: auto; width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font-size: 1rem; cursor: pointer; flex-shrink: 0; }
        .tags { position: absolute; top: calc(72px + env(safe-area-inset-top, 0px)); left: 8px; right: 100px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; pointer-events: none; }
        .tag { padding: 3px 9px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-size: .72rem; font-weight: 800; color: var(--dim); max-width: 100%; }
        .tag.quest { color: #ffe27a; border-color: rgba(255, 210, 74, 0.45); }
        .tag.demo { color: #ffb8f0; border-color: rgba(255, 140, 220, 0.45); } /* 🧪 always on screen: it's a demo */
        .demo-note { margin: 6px 0 2px; padding: 7px 10px; border-radius: 10px; background: rgba(255, 140, 220, 0.1); border: 1px solid rgba(255, 140, 220, 0.35); color: #ffd6f4; font-size: .78rem; text-align: left; }
        .tag.quest.done { color: #7ddc92; border-color: rgba(125, 220, 146, 0.5); }
        #mini { position: absolute; top: calc(62px + env(safe-area-inset-top, 0px)); right: 8px; width: 84px; height: 84px; border-radius: 10px; background: rgba(10, 9, 20, 0.7); border: 1px solid var(--line); pointer-events: none; }
        .boss-bar { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(184px + env(safe-area-inset-bottom, 0px)); width: min(70vw, 320px); text-align: center; pointer-events: none; }
        .boss-bar b { display: block; font-size: .75rem; margin-bottom: 3px; text-shadow: 0 1px 3px #000; }
        .boss-bar div { height: 9px; border-radius: 6px; background: #2a1020; border: 1px solid rgba(255, 255, 255, 0.25); overflow: hidden; }
        .boss-bar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #b64bff, #ff4f8b); transition: width .15s; }
        .toast { position: absolute; left: 50%; top: 32%; transform: translate(-50%, -50%); padding: 8px 16px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); font-weight: 900; text-align: center; pointer-events: none; opacity: 0; transition: opacity .25s; max-width: 86vw; }
        .toast.on { opacity: 1; }
        /* controls */
        .pad { position: absolute; left: 0; bottom: 0; width: 55%; height: 55%; }
        .stick { position: absolute; width: 104px; height: 104px; margin: -52px 0 0 -52px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.25); background: rgba(255, 255, 255, 0.06); display: none; pointer-events: none; }
        .stick i { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(255, 255, 255, 0.35); }
        .stick-hint { position: absolute; left: 34px; bottom: calc(46px + env(safe-area-inset-bottom, 0px)); width: 92px; height: 92px; border-radius: 50%; border: 2px dashed rgba(255, 255, 255, 0.18); display: flex; align-items: center; justify-content: center; color: rgba(255, 255, 255, 0.35); font-size: .7rem; font-weight: 800; text-align: center; pointer-events: none; }
        .act { position: absolute; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.35); color: #fff; font-size: 1.8rem; cursor: pointer; touch-action: none; display: flex; align-items: center; justify-content: center; }
        .act:active, .act.on { filter: brightness(1.3); transform: scale(0.95); }
        #atkBtn { right: 22px; bottom: calc(34px + env(safe-area-inset-bottom, 0px)); width: 84px; height: 84px; background: radial-gradient(circle at 35% 30%, #ff7a5a, #b8243a); box-shadow: 0 6px 18px rgba(184, 36, 58, 0.5); }
        #dashBtn { right: 116px; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); width: 56px; height: 56px; font-size: 1.3rem; background: radial-gradient(circle at 35% 30%, #6ab8ff, #2a5aa8); }
        #dashBtn.cool { opacity: .45; }
        #useBtn { right: 30px; bottom: calc(132px + env(safe-area-inset-bottom, 0px)); width: 60px; height: 60px; font-size: 1.4rem; background: radial-gradient(circle at 35% 30%, #ffe27a, #c8941a); }
        #useBtn[hidden] { display: none; }
        .weapon-chip { position: absolute; right: 22px; bottom: calc(122px + env(safe-area-inset-bottom, 0px)); padding: 3px 9px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-size: .7rem; font-weight: 800; pointer-events: none; }
        body.can-use .weapon-chip { bottom: calc(198px + env(safe-area-inset-bottom, 0px)); }
        /* screens */
        .screen { position: absolute; inset: 0; display: flex; align-items: flex-start; justify-content: center; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 24px; background: rgba(8, 7, 16, 0.92); overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; touch-action: manipulation; }
        .screen[hidden] { display: none; }
        .card { width: 100%; max-width: 420px; margin: auto 0; padding: 18px 16px; border-radius: 20px; background: linear-gradient(170deg, #241f44, #14112a); border: 1px solid rgba(160, 130, 255, 0.4); box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5); text-align: center; }
        .card h1 { margin: 0 0 2px; font-size: 1.45rem; }
        .gate-back { display: block; width: max-content; margin: -4px auto 8px 0; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.06); color: var(--ink); font-size: .82rem; font-weight: 800; cursor: pointer; }
        .card .sub { color: var(--dim); font-size: .85rem; margin: 0 0 12px; }
        .hero { display: flex; gap: 14px; align-items: center; text-align: left; margin: 0 0 12px; }
        .hero-fig { flex-shrink: 0; width: 98px; height: 118px; border-radius: 16px; overflow: hidden; background: #2b2550; }
        .hero-fig svg { display: block; width: 98px; height: 118px; }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; font-size: .8rem; }
        .stats div { display: flex; justify-content: space-between; gap: 6px; padding: 3px 0; border-bottom: 1px solid var(--line); }
        .stats span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
        .stats b { font-weight: 900; }
        .weapon-line { margin-top: 6px; font-size: .82rem; font-weight: 800; }
        .modes { display: flex; flex-direction: column; gap: 8px; }
        .mode { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.05); color: var(--ink); text-align: left; cursor: pointer; }
        .mode:active { transform: scale(0.98); }
        .mode .mi { font-size: 1.9rem; flex-shrink: 0; }
        .mode b { display: block; font-size: 1rem; }
        .mode small { display: block; font-size: .76rem; color: var(--dim); margin-top: 2px; }
        .mode.main { border-color: rgba(255, 210, 74, 0.6); background: linear-gradient(135deg, rgba(255, 210, 74, 0.16), rgba(255, 140, 60, 0.08)); }
        .big-btn { display: block; width: 100%; padding: 14px; border: none; border-radius: 16px; font-size: 1.1rem; font-weight: 900; color: #2a1200; cursor: pointer; background: linear-gradient(135deg, #ffe27a, #ff9f43); box-shadow: 0 5px 0 #c26a1a; }
        .big-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #c26a1a; }
        .ghost-btn { display: block; width: 100%; margin-top: 10px; padding: 11px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.06); color: var(--ink); font-size: .95rem; font-weight: 800; cursor: pointer; }
        .how { margin: 12px 0 0; font-size: .76rem; color: var(--dim); text-align: left; line-height: 1.5; }
        .how summary { cursor: pointer; font-weight: 800; color: var(--ink); }
        .note { margin-top: 10px; font-size: .74rem; color: #ffcf7a; }
        .tally { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 10px 0 14px; }
        .tally span { padding: 8px 12px; border-radius: 12px; background: rgba(255, 255, 255, 0.06); border: 1px solid var(--line); font-weight: 900; }
        /* a conversation */
        .dialog { position: absolute; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(92vw, 400px); padding: 12px 14px; border-radius: 16px; background: var(--panel); border: 1px solid rgba(255, 210, 74, 0.5); }
        .dialog[hidden] { display: none; }
        /* next to something you can use: "🛒 Shop — go in?" ✅ Yes / No */
        .prompt { position: absolute; left: 50%; bottom: calc(215px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(86vw, 330px); padding: 10px 12px 8px; border-radius: 16px; background: var(--panel); border: 1px solid rgba(255, 210, 74, 0.6); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45); text-align: center; animation: promptIn .18s ease-out; z-index: 5; }
        .prompt[hidden] { display: none; }
        @keyframes promptIn { from { transform: translate(-50%, 10px); opacity: 0; } }
        .prompt b { display: block; font-size: 1rem; margin-bottom: 8px; }
        .prompt .opts { display: flex; gap: 8px; }
        .prompt button { flex: 1; padding: 10px; border-radius: 12px; font-weight: 900; font-size: .95rem; cursor: pointer; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.08); color: var(--ink); }
        .prompt button.sel { border-color: transparent; color: #2a1200; background: linear-gradient(135deg, #ffe27a, #ff9f43); box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.55); transform: scale(1.04); }
        .prompt small { display: block; margin-top: 6px; font-size: .72rem; color: var(--dim); }
        .prompt kbd { display: inline-block; padding: 0 6px; border-radius: 6px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.08); font: inherit; font-weight: 900; color: var(--ink); }
        .dialog b { display: block; margin-bottom: 4px; }
        .dialog p { margin: 0 0 10px; font-size: .9rem; line-height: 1.4; }
        .dialog .opts { display: flex; flex-wrap: wrap; gap: 6px; }
        .dialog button { flex: 1 1 auto; padding: 9px 10px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.08); color: var(--ink); font-weight: 800; cursor: pointer; }
        .dialog button.main { background: linear-gradient(135deg, #ffe27a, #ff9f43); color: #2a1200; border: none; }
        .dialog button:disabled { opacity: .45; }
        @media (min-width: 700px) { .stick-hint { display: none; } }
        @media (max-width: 380px) { .hero { gap: 10px; } .hero-fig, .hero-fig svg { width: 80px; height: 96px; } .stats { font-size: .74rem; gap: 2px 8px; } }
        @media (prefers-reduced-motion: reduce) { .sheet-card { animation: none; } }
        /* 🏰 the lobby: your ✨ instead of a run's loot; no map */
        .wallet { display: none; gap: 10px; padding: 5px 9px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); font-size: .8rem; font-weight: 800; white-space: nowrap; }
        body.in-lobby .loot, body.in-lobby #mini { display: none; }
        body.in-lobby .wallet { display: flex; }
        /* a sheet from the bottom: setting out, buying, a question */
        .sheet { position: absolute; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; padding: 0 10px calc(10px + env(safe-area-inset-bottom, 0px)); background: rgba(8, 7, 16, 0.55); touch-action: manipulation; }
        .sheet[hidden] { display: none; }
        .sheet-card { width: 100%; max-width: 420px; max-height: 82vh; overflow-y: auto; overscroll-behavior: contain; padding: 16px; border-radius: 20px; background: linear-gradient(170deg, #241f44, #14112a); border: 1px solid rgba(255, 210, 74, 0.5); box-shadow: 0 -6px 30px rgba(0, 0, 0, 0.5); animation: sheetUp .22s ease-out; text-align: left; }
        @keyframes sheetUp { from { transform: translateY(30px); opacity: 0; } }
        .sheet-card h2 { margin: 0 0 4px; font-size: 1.15rem; }
        /* the top of a join sheet: a big picture, what it is */
        .sheet-hero { display: flex; align-items: center; gap: 12px; margin: 0 0 10px; padding: 12px; border-radius: 16px; background: linear-gradient(135deg, var(--c1, #3a2a6a), var(--c2, #1d1838)); border: 1px solid rgba(255, 255, 255, 0.16); }
        .sheet-hero .big { flex-shrink: 0; width: 62px; height: 62px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 2.3rem; background: rgba(0, 0, 0, 0.25); border: 1px solid rgba(255, 255, 255, 0.2); }
        .sheet-hero small { display: block; font-size: .68rem; font-weight: 900; letter-spacing: .08em; color: rgba(255, 255, 255, 0.78); text-transform: uppercase; }
        .sheet-hero b { display: block; font-size: 1.15rem; line-height: 1.2; }
        .sheet-hero .stars { color: #ffd24a; letter-spacing: 2px; }
        .sheet-hero .stars i { font-style: normal; color: rgba(255, 255, 255, 0.25); }
        .facts { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
        .facts span { padding: 5px 9px; border-radius: 999px; background: rgba(255, 255, 255, 0.07); border: 1px solid var(--line); font-size: .78rem; font-weight: 800; }
        .wcmp { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 0 12px; }
        .wcard { padding: 10px 8px; border-radius: 14px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line); text-align: center; min-width: 0; }
        .wcard.new { border-color: rgba(255, 210, 74, 0.65); background: rgba(255, 210, 74, 0.08); }
        .wcard small { display: block; font-size: .64rem; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
        .wcard .big { display: block; font-size: 2rem; line-height: 1.25; }
        .wcard b { display: block; font-size: .84rem; line-height: 1.2; }
        .wcard .wk { display: block; font-size: .68rem; color: var(--dim); margin: 2px 0 6px; }
        .wcard dl { display: grid; grid-template-columns: auto auto; gap: 2px 6px; margin: 0; font-size: .74rem; text-align: left; }
        .wcard dt { color: var(--dim); white-space: nowrap; } .wcard dd { margin: 0; font-weight: 900; text-align: right; }
        .wcard dd.up { color: #7ddc92; } .wcard dd.down { color: #ff9a9a; }
        /* 🎒 the bag: gear slots, a grid of slots */
        .gear-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0 0 12px; }
        .gslot { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; padding: 8px 4px; border-radius: 14px; border: 1px dashed rgba(255, 255, 255, 0.25); background: rgba(255, 255, 255, 0.04); color: var(--ink); cursor: pointer; font: inherit; }
        .gslot.full { border-style: solid; border-color: rgba(255, 210, 74, 0.6); background: rgba(255, 210, 74, 0.07); }
        .gslot .ic { font-size: 1.6rem; line-height: 1.2; } .gslot small { font-size: .66rem; color: var(--dim); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .bag-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
        .cell { position: relative; aspect-ratio: 1; border-radius: 12px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.06); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: var(--ink); cursor: pointer; padding: 0; font-family: inherit; }
        .cell.empty { border-style: dashed; background: transparent; cursor: default; }
        .cell .n { position: absolute; right: 3px; bottom: 1px; font-size: .68rem; font-weight: 900; text-shadow: 0 1px 2px #000; }
        .cell .lv, .gslot .lv, .fslot .lv { position: absolute; left: 3px; top: 2px; font-size: .6rem; font-weight: 900; color: #ffe27a; text-shadow: 0 1px 2px #000; }
        .gslot, .fslot { position: relative; }
        .warn-box { margin: 0 0 10px; padding: 9px 11px; border-radius: 12px; border: 1px solid rgba(255, 154, 154, 0.55); background: rgba(255, 90, 106, 0.1); font-size: .8rem; text-align: left; line-height: 1.45; }
        .xpbar { height: 7px; border-radius: 99px; background: rgba(255, 255, 255, 0.1); overflow: hidden; margin: 4px 0 2px; } .xpbar i { display: block; height: 100%; background: linear-gradient(90deg, #ffe27a, #ff9f43); }
        .opt.buyable { border-style: dashed; } .opt .price { font-size: .68rem; font-weight: 900; color: #8fd8ff; } .opt .price s { color: var(--dim); font-weight: 700; margin-left: 3px; }
        .cell.r-uncommon { box-shadow: inset 0 0 0 1px rgba(125, 220, 146, 0.6); } .cell.r-rare { box-shadow: inset 0 0 0 1px rgba(90, 170, 255, 0.75); }
        .cell.r-epic { box-shadow: inset 0 0 0 1px rgba(190, 120, 255, 0.85); } .cell.r-legendary { box-shadow: inset 0 0 0 2px rgba(255, 196, 60, 0.9); }
        .rar-common { color: #c9c3e6; } .rar-uncommon { color: #7ddc92; } .rar-rare { color: #6ab4ff; } .rar-epic { color: #c99bff; } .rar-legendary { color: #ffc43c; }
        .icard { display: flex; gap: 12px; align-items: center; margin: 0 0 10px; }
        .icard .big { flex-shrink: 0; width: 70px; height: 70px; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 2.6rem; background: rgba(255, 255, 255, 0.07); border: 1px solid var(--line); overflow: hidden; }
        .icard b { display: block; font-size: 1.12rem; } .icard small { display: block; font-size: .74rem; font-weight: 800; text-transform: capitalize; }
        .lines { list-style: none; margin: 0 0 12px; padding: 0; font-size: .86rem; line-height: 1.6; }
        /* ⚗️ fusion */
        .fuse-row { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; align-items: center; gap: 6px; margin: 0 0 10px; }
        .fslot { aspect-ratio: 1; border-radius: 16px; border: 2px dashed rgba(255, 255, 255, 0.28); background: rgba(255, 255, 255, 0.04); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--ink); cursor: pointer; font: inherit; padding: 4px; min-width: 0; }
        .fslot.full { border-style: solid; border-color: rgba(201, 155, 255, 0.7); background: rgba(201, 155, 255, 0.08); }
        .fslot .ic { font-size: 1.8rem; line-height: 1.1; } .fslot small { font-size: .64rem; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--dim); }
        .fuse-row .op { font-size: 1.2rem; font-weight: 900; color: var(--dim); }
        .fslot.out { border-color: rgba(255, 210, 74, 0.6); cursor: default; }
        .chance { text-align: center; font-weight: 900; margin: 0 0 8px; } .chance small { display: block; font-size: .74rem; color: #ff9a9a; font-weight: 700; }
        .recipe-list { display: flex; flex-direction: column; gap: 6px; text-align: left; }
        .recipe { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.05); color: var(--ink); font: inherit; cursor: pointer; text-align: left; width: 100%; }

        .sheet-card ul { list-style: none; margin: 0 0 12px; padding: 0; font-size: .88rem; line-height: 1.6; }
        .sheet-card .art { display: flex; justify-content: center; margin: 0 0 8px; }
        .sheet-card .art > * { width: 72px; height: 72px; border-radius: 16px; overflow: hidden; }
        /* the controls (on ⏸) */
        .controls { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; margin: 6px 0 12px; text-align: left; font-size: .84rem; align-items: center; }
        .controls .k { display: flex; align-items: center; justify-content: center; min-width: 40px; height: 34px; padding: 0 6px; border-radius: 10px; font-size: 1.2rem; background: rgba(255, 255, 255, 0.07); border: 1px solid var(--line); }
        .controls small { display: block; color: var(--dim); font-size: .72rem; }
        .pause-quest { margin: 0 0 6px; padding: 8px 10px; border-radius: 12px; background: rgba(255, 210, 74, 0.08); border: 1px solid rgba(255, 210, 74, 0.35); font-size: .84rem; font-weight: 800; text-align: left; }
        /* 🛒 the shop and 🪞 the wardrobe */
        .panel-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
        .panel-top h1 { flex: 1; text-align: left; font-size: 1.2rem; margin: 0; }
        .panel-top .back { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.06); color: var(--ink); font-size: 1.1rem; cursor: pointer; flex-shrink: 0; }
        .panel-top .sd { padding: 5px 10px; border-radius: 999px; background: rgba(143, 216, 255, 0.12); border: 1px solid rgba(143, 216, 255, 0.35); font-size: .82rem; font-weight: 900; white-space: nowrap; }
        .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 0 6px; margin: 0 0 8px; } /* (they wrap — a row that scrolls sideways can't be scrolled with a mouse) */
        .chips .lbl { align-self: center; font-size: .74rem; font-weight: 900; color: var(--dim); }
        .chip.sm { padding: 5px 9px; font-size: .74rem; }
        .chip { flex-shrink: 0; padding: 7px 11px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.06); color: var(--ink); font-weight: 800; font-size: .8rem; cursor: pointer; }
        .chip.on { background: linear-gradient(135deg, #ffe27a, #ff9f43); color: #2a1200; border-color: transparent; }
        .items { display: flex; flex-direction: column; gap: 8px; text-align: left; }
        .item { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 14px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line); }
        .item.on { border-color: rgba(125, 220, 146, 0.6); }
        .pic { flex-shrink: 0; width: 48px; height: 48px; border-radius: 12px; overflow: hidden; background: #2b2550; display: flex; align-items: center; justify-content: center; }
        .pic > * { display: block; max-width: 100%; max-height: 100%; }
        .item .info { flex: 1; min-width: 0; }
        .item .info b { display: block; font-size: .88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .rar { font-size: .66rem; color: var(--dim); text-transform: capitalize; }
        .fx { display: block; font-size: .72rem; color: #9fe0a8; font-weight: 800; }
        .fx .minus { color: #ff9a9a; } .fx .same { color: var(--dim); font-weight: 600; }
        .item .buy { flex-shrink: 0; padding: 8px 10px; border-radius: 12px; border: none; font-weight: 900; font-size: .8rem; cursor: pointer; background: linear-gradient(135deg, #ffe27a, #ff9f43); color: #2a1200; white-space: nowrap; }
        .item .buy.ghost { background: rgba(255, 255, 255, 0.08); color: var(--ink); border: 1px solid var(--line); }
        .item .buy:disabled { opacity: .55; cursor: default; }
        .item .desc { display: block; font-size: .72rem; color: var(--dim); line-height: 1.3; }
        .item .was { display: block; font-size: .64rem; color: var(--dim); text-decoration: line-through; text-align: center; }
        .slots { display: flex; flex-direction: column; gap: 6px; text-align: left; }
        .slot-row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 8px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.05); color: var(--ink); text-align: left; cursor: pointer; font: inherit; }
        .slot-row.open { border-color: rgba(255, 210, 74, 0.6); }
        .slot-row .si { width: 26px; text-align: center; font-size: 1.05rem; flex-shrink: 0; }
        .slot-row .pic { width: 40px; height: 40px; border-radius: 10px; }
        .slot-row .info { flex: 1; min-width: 0; }
        .slot-row .info b { display: block; font-size: .86rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .slot-row .info small { font-size: .7rem; color: var(--dim); }
        .opts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin: 2px 0 6px; }
        .opt { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; padding: 6px 4px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.04); color: var(--ink); cursor: pointer; font: inherit; }
        .opt.on { border-color: #7ddc92; background: rgba(125, 220, 146, 0.12); }
        .opt .pic { width: 52px; height: 52px; }
        .opt small { max-width: 100%; font-size: .66rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .opt .fx { font-size: .62rem; text-align: center; }
        .opt.more { justify-content: center; font-size: .74rem; font-weight: 800; color: #ffe27a; }
        .saving { min-height: 1.2em; margin: 4px 0 8px; font-size: .8rem; font-weight: 800; color: #9fe0a8; }
    </style>
</head>
<body>
<div id="keep">
    <canvas id="cv"></canvas>
    <div class="hud-top">
        <div class="bars">
            <div class="bar"><div class="bar-track hp-track"><i id="hpFill"></i></div><span id="hpText"></span></div>
            <div class="bar"><div class="bar-track mp-track"><i id="mpFill"></i></div><span id="mpText"></span></div>
            <div class="bar"><div class="bar-track xp-track"><i id="xpFill"></i></div><span id="lvText"></span></div>
        </div>
        <div class="wallet" id="wallet"><span title="Your shards — the Keep's own money, from the roads and from selling, for the shop's supplies">🔶 <b id="walletGold">0</b></span><span title="Your Stardust (your account's)">✨ <b id="walletSd">–</b></span></div>
        <div class="loot" aria-label="What you've picked up"><span title="Shards (this run)">🔶<b id="goldTxt">0</b></span><span title="Stardust">✨<b id="sdTxt">0</b></span><span title="Hearts" id="hrBox" hidden>💗<b id="hrTxt">0</b></span><span title="Tokens" id="tkBox" hidden>🪙<b id="tkTxt">0</b></span></div>
        <button type="button" class="hud-btn" id="pauseBtn" aria-label="Pause">⏸</button>
    </div>
    <div class="tags"><div class="tag demo" id="demoTag">🧪 Demo — still being built</div><div class="tag" id="floorTag"></div><div class="tag quest" id="questTag"></div><div class="tag" id="bagTag" hidden></div></div>
    <canvas id="mini" width="168" height="168"></canvas>
    <button type="button" class="hud-btn" id="bagBtn" aria-label="Your bag (B)" title="Your bag (B)">🎒</button>
    <div class="boss-bar" id="bossBar" hidden><b id="bossName"></b><div><i id="bossFill"></i></div></div>
    <div class="toast" id="toast"></div>
    <div class="pad" id="pad"></div>
    <div class="stick" id="stick"><i></i></div>
    <div class="stick-hint" id="stickHint">drag<br>to move</div>
    <div class="weapon-chip" id="weaponTag"></div>
    <button type="button" class="act" id="useBtn" hidden aria-label="Use">✋</button>
    <button type="button" class="act" id="dashBtn" aria-label="Dash">💨</button>
    <button type="button" class="act" id="atkBtn" aria-label="Attack (aims for you)">⚔️</button>
    <div class="dialog" id="dialog" hidden></div>
    <div class="prompt" id="prompt" hidden role="dialog" aria-live="polite"><b id="promptText"></b><div class="opts"><button type="button" class="sel" id="promptYes" data-v="yes">✅ Yes</button><button type="button" id="promptNo" data-v="no">✖ No</button></div><small><kbd>←</kbd> <kbd>→</kbd> choose · <kbd>Space</kbd> picks · or tap ⚔️</small></div>
    <div class="screen" id="endScreen" hidden><div class="card" id="endCard"></div></div>
    <div class="screen" id="panelScreen" hidden><div class="card" id="panelCard"></div></div>
    <div class="screen" id="pauseScreen" hidden><div class="card" id="pauseCard"></div></div>
    <div class="sheet" id="sheet" hidden><div class="sheet-card" id="sheetCard" role="dialog" aria-modal="true"></div></div>
</div>
<script src="progress-core.js"></script>
<script src="character-core.js"></script>
<script src="dungeon-core.js"></script>
<script type="module" src="appState.js"></script>
<script>
(function () {
    "use strict";
    const D = window.DungeonCore, C = window.CharacterCore, P = window.ProgressCore;
    const $ = (id) => document.getElementById(id);
    const cv = $("cv"), ctx = cv.getContext("2d"), mctx = $("mini").getContext("2d");
    const TILE = 16, CELL_W = 24, CELL_H = 18, GRID = D.GRID;
    const MW = GRID * CELL_W, MH = GRID * CELL_H;
    const VOID = 0, FLOOR = 1, WALL = 2, DOOR = 3;
    const sgtDay = () => new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10);
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
    const angTo = (a, b) => Math.atan2(b.y - a.y, b.x - a.x);
    const rnd = Math.random;
    const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    /* ---------------- you, and your progress ----------------
       Progress (the story, your bag, chest, shards and gear) is kept on this
       device for now, per player — it moves to your account with real rewards. */
    let outfit = C.cleanOutfit({}, []), stats = D.statsOf(outfit), heroImg = null, uid = "guest";
    // your account (signed in): what you own and your ✨ — the 🛒 shop and 🪞 wardrobe use them
    const me = { signedIn: false, loaded: false, items: [], stardust: 0 };
    // inside the app (opened from Games, full screen): ☰ → ← Back to Games closes it
    const inApp = (() => { try { return window.parent !== window && typeof window.parent.closeKeepHome === "function"; } catch (e) { return false; } })();
    const SAVE_KEY = () => "kih_keep_v1:" + uid;
    function loadSave() { try { const s = JSON.parse(localStorage.getItem(SAVE_KEY())); return s && typeof s === "object" ? s : {}; } catch (e) { return {}; } }
    function writeSave(s) { try { localStorage.setItem(SAVE_KEY(), JSON.stringify(s)); } catch (e) { } }
    let save = loadSave();
    /* 🔶 shards — the Keep's own money (named so nobody takes them for the app's 🪙):
       the ones you pick up are kept (your pouch, on this device like your stars);
       the shop's 🧪 supplies: potions you carry (they drink themselves when
       you're low) and elixirs for your next run. */
    const SUPPLIES = [
        { id: "hpPot", icon: "❤️", name: "Health potion", desc: "Goes in your 🎒 bag — drinks itself when your HP drops below 30% (heals 35%).", price: 30, carry: true },
        { id: "mpPot", icon: "🔷", name: "Mana potion", desc: "Goes in your 🎒 bag — drinks itself when you run out of mana (refills half).", price: 25, carry: true },
        { id: "might", icon: "💪", name: "Elixir of Might", desc: "+25% ⚔️ damage — for your next run.", price: 60, buff: { dmg: 25 } },
        { id: "iron", icon: "🛡️", name: "Iron Skin tonic", desc: "+15% 🛡️ defense — for your next run.", price: 60, buff: { def: 15 } },
        { id: "swift", icon: "💨", name: "Swift tonic", desc: "+15 👟 speed — for your next run.", price: 45, buff: { speed: 15 } },
        { id: "lucky", icon: "🍀", name: "Lucky charm", desc: "+20% 🍀 luck (more drops) — for your next run.", price: 45, buff: { luck: 20 } }
    ];
    const BUFFS = { ...Object.fromEntries(SUPPLIES.filter(x => x.buff).map(x => [x.id, { icon: x.icon, add: x.buff }])), blessed: { icon: "🌟", add: { luck: 20, crit: 5 } } };
    const gold = () => Math.max(0, Math.floor(Number(save.gold) || 0));
    /* 🎒 your bag (D.cleanBag: slots, stacks) and the Keep's gear you wear (save.gear);
       save.seen: everything you've ever had (the 📖 collection's ✓). */
    let invOf = null;
    function inv() {
        if (invOf !== save || !save.inv) {
            const old = save.bag && typeof save.bag === "object" ? save.bag : null; // (potions from before the bag)
            save.inv = D.cleanBag(save.inv);
            if (old) { ["hpPot", "mpPot"].forEach(k => { if (old[k] > 0) D.bagAdd(save.inv, k, old[k]); }); delete save.bag; }
            invOf = save;
        }
        return save.inv;
    }
    const seen = () => { if (!save.seen || typeof save.seen !== "object") save.seen = {}; return save.seen; };
    // what you wear from the Keep: { weapon: { id, lv, xp }, armour, charm } (an old save's plain ids → Lv 1)
    function gear() {
        const g = save.gear && typeof save.gear === "object" ? save.gear : {}, out = {};
        D.GEAR_SLOTS.forEach(sl => { const e = D.gearEntry(g[sl.id]); if (e && D.ITEMS[e.id].slot === sl.id) out[sl.id] = e; });
        return (save.gear = out);
    }
    // 📜 the recipes you know (found on the roads, or made): the furnace names what they make
    const recipesKnown = () => { if (!save.recipes || typeof save.recipes !== "object") save.recipes = {}; return save.recipes; };
    function learnRecipe() {
        const id = D.recipeToLearn(Object.fromEntries(D.RECIPES.map(r => [r[2], known(r[2])])), rnd);
        if (!id) { save.gold = gold() + 5; writeSave(save); return toast("📜 A recipe you know already — +🔶 5", 1300); }
        recipesKnown()[id] = true; writeSave(save);
        const r = D.RECIPES.find(x => x[2] === id);
        toast(`📜 New recipe!<div style="font-size:.8rem;margin-top:3px">${iconOf(id, 16)} <b>${esc(D.ITEMS[id].name)}</b> = ${iconOf(r[0], 14)} ${esc(D.ITEMS[r[0]].name)} + ${iconOf(r[1], 14)} ${esc(D.ITEMS[r[1]].name)}</div>`, 2800);
        if (panel && !$("panelScreen").hidden) renderPanel();
    }
    // ⭐ your own level (what you beat, as your gear) — it adds to your stats
    const hero = () => (save.hero = D.heroEntry(save.hero));
    // your stats down here: your outfit, the Keep's gear on top, then your level
    const baseStats = (o, g) => D.heroStats(D.gearStats(D.statsOf(o), g), hero().lv);
    const heroLine = (lv) => { const a = D.heroAdd(lv); return Object.keys(a).filter(k => a[k]).map(k => `+${a[k]}${D.STAT_INFO[k].unit || ""} ${D.STAT_INFO[k].icon}`).join(" "); };
    function heroGain(n) {
        const h = hero(), was = h.lv, ups = D.heroXp(h, n);
        writeSave(save);
        if (!ups) return;
        refreshStats();
        if (G && G.player) { const p = G.player; p.hp = p.maxHp; p.mana = p.maxMana; fxRing(p.x, p.y, 34, "#ffd24a", 0.8); }
        const now = D.heroAdd(h.lv), then = D.heroAdd(was);
        banner(`🌟 Level ${h.lv}!`, Object.keys(now).filter(k => now[k] > then[k]).map(k => `+${now[k] - then[k]}${D.STAT_INFO[k].unit || ""} ${D.STAT_INFO[k].icon}`).join(" ") + " · fully healed");
        if (panel && !$("panelScreen").hidden) renderPanel();
    }
    // ⬆️ what you beat while wearing the Keep's gear: XP for every piece you wear
    function gearXp(n) {
        const g = gear(), worn = Object.values(g);
        if (!worn.length) return;
        let up = null;
        worn.forEach(e => { if (D.addXp(e, n)) up = e; });
        writeSave(save);
        if (!up) return;
        refreshStats();
        toast(`⬆️ ${D.ITEMS[up.id].icon} ${esc(D.ITEMS[up.id].name)} is <b>Lv ${up.lv}</b>!`, 1500);
        if (G) fxRing(G.player.x, G.player.y, 26, "#ffe27a", 0.6);
    }
    // your stats again (your gear went up a level, or you put something on) — at home: topped up; mid-run: the elixirs stay, your HP doesn't refill
    function refreshStats(weaponToo) {
        stats = withBuffs(baseStats(outfit, gear()), (G && G.buffs) || []);
        if (!G || !plan) return;
        const p = G.player, home = plan.mode === "lobby" || plan.mode === "house";
        Object.assign(p, home ? { maxHp: stats.hp, hp: stats.hp, maxMana: stats.mana, mana: stats.mana } : { maxHp: stats.hp, hp: Math.min(p.hp, stats.hp), maxMana: stats.mana, mana: Math.min(p.mana, stats.mana) });
        if (weaponToo || home) G.weapon = stats.weapon;
    }
    // something found or made: into the bag (a satchel makes the bag bigger at once). How many went in. (`lv`: gear's { lv })
    function gainItem(id, n, lv) {
        const it = D.ITEMS[id], b = inv();
        if (!it) return 0;
        const isNew = !seen()[id];
        seen()[id] = true;
        if (isNew && D.findPays(id)) setTimeout(payFinds, 0); // 🪙 for a new rare-or-better find
        if (it.kind === "bag") { b.slots = Math.min(D.BAG.max, b.slots + it.slots); writeSave(save); return 1; }
        const got = D.bagAdd(b, id, n == null ? 1 : n, lv);
        if (got && G && G.trip && it.kind === "mat") G.trip[id] = (G.trip[id] || 0) + got;
        writeSave(save);
        if (got && panel && !$("panelScreen").hidden) renderPanel(); // (the bag or the furnace open: show it)
        return got;
    }
    /* 🪙 D.FIND_TOKENS for each rare-or-better thing you find for the first time
       (D.findPays) — paid by the server, once per thing per account (save.coined:
       the ones it's paid). Common and uncommon things pay nothing. */
    const coined = () => { if (!save.coined || typeof save.coined !== "object") save.coined = {}; return save.coined; };
    let paying = false;
    async function payFinds() {
        if (!me.signedIn || paying || !window.AppState || !window.AppState.keepFinds) return;
        const mine = save, ids = Object.keys(seen()).filter(id => D.findPays(id) && !coined()[id]);
        if (!ids.length) return;
        paying = true;
        try {
            const r = await window.AppState.keepFinds(ids);
            if (mine !== save) return; // (another account's save by now)
            (r.found || []).forEach(id => { coined()[id] = true; });
            writeSave(save);
            if (r.paid > 0) {
                const one = r.fresh && r.fresh.length === 1 && D.ITEMS[r.fresh[0]];
                if (G && G.player) fxText(G.player.x, G.player.y - 30, `+${r.paid}🪙`, "#ffd24a", true);
                toast(one ? `🪙 +${r.paid} — a new find: ${iconOf(r.fresh[0], 16)} <b>${esc(one.name)}</b>` : `🪙 +${r.paid} — for ${r.fresh.length} rare finds in the Keep`, 1800);
            }
        } catch (e) { console.warn("Couldn't add your 🪙 for a new find:", e.message); } // (tried again with the next find, or next time)
        finally { paying = false; }
        if (Object.keys(seen()).some(id => D.findPays(id) && !coined()[id]) && mine === save) setTimeout(payFinds, 1500); // found more meanwhile
    }
    const RAR = (r) => `<span class="rar-${r || "common"}">${esc(r || "common")}</span>`;
    // a potion, drawn — a bottle, not a heart
    const potionSvg = (c, sz) => `<svg viewBox="0 0 24 24" width="${sz || 28}" height="${sz || 28}" aria-hidden="true"><rect x="9.3" y="1.2" width="5.4" height="3.2" rx="1" fill="#b98a4e"/><rect x="10" y="4" width="4" height="5.5" fill="#dfe9f5"/><circle cx="12" cy="15.2" r="7.6" fill="#dfe9f5"/><circle cx="12" cy="15.7" r="6.3" fill="${c}"/><rect x="5.4" y="9.6" width="13.2" height="4.4" fill="#dfe9f5"/><ellipse cx="9.3" cy="16.4" rx="1.4" ry="2.4" fill="#fff" opacity=".55"/></svg>`;
    const iconOf = (id, sz) => { const it = D.ITEMS[id]; return !it ? "❔" : it.kind === "potion" ? potionSvg(it.color, sz) : it.icon; };
    const SUP_POTION = { hpPot: 1, mpPot: 1 };
    const buffsReady = () => Object.keys(save.buffs || {}).filter(k => save.buffs[k] && BUFFS[k]);
    function withBuffs(st, ids) {
        const out = { ...st };
        (ids || []).forEach(k => Object.entries(BUFFS[k].add).forEach(([s2, v]) => { out[s2] = (out[s2] || 0) + v; }));
        Object.keys(D.CAPS).forEach(k => { out[k] = Math.min(D.CAPS[k], out[k]); });
        return out;
    }
    // 📜 the story so far (kept with your other progress)
    const STORY1 = D.STORY[0];
    function story() {
        if (!save.story || typeof save.story !== "object") save.story = {};
        if (!save.story.cleared || typeof save.story.cleared !== "object") save.story.cleared = {};
        if (!save.story.seen || typeof save.story.seen !== "object") save.story.seen = {};
        return save.story;
    }
    const roadOpen = (road) => D.roadOpen(story().cleared, road);

            const w = r0.w || (r0.big ? 21 : 15), h = r0.h || (r0.big ? 15 : 11);
            const cx = r0.gx * CELL_W + (CELL_W >> 1), cy = r0.gy * CELL_H + (CELL_H >> 1);
            const room = { ...r0, w, h, x0: cx - (w >> 1), y0: cy - (h >> 1), cx, cy, doors: [], cleared: !(r0.type === "fight" || r0.type === "boss"), wave: 0, locked: false };

            return room;
        });
        f.links.forEach(([a, b]) => {
            let A = rooms[a], B = rooms[b];
            if (B.gx < A.gx || B.gy < A.gy) [A, B] = [B, A];
            if (B.gx > A.gx) { // a path across
                const y = A.cy, xa = A.x0 + A.w - 1, xb = B.x0;
                for (let x = xa; x <= xb; x++) for (let dy = -2; dy <= 2; dy++) {
                    const edge = Math.abs(dy) === 2;

    // villagers stroll about, and say something when you come by
    function updateLobby(dt) {
        const p = G.player, r = rooms[0];
        for (const w of G.walkers) {
            if (w.wait > 0) { w.wait -= dt; }
            else {
                const d = Math.hypot(w.tx - w.x, w.ty - w.y);
                if (d < 3) { w.wait = 1.5 + rnd() * 3; const t = roomSpot(r, 0.15 + rnd() * 0.7, 0.2 + rnd() * 0.7); w.tx = t.x; w.ty = t.y; }
                else {
                    const ox = w.x, oy = w.y, sp = 16 * dt;
                    moveEnt(w, (w.tx - w.x) / d * sp, (w.ty - w.y) / d * sp);
                    if (Math.abs(w.x - ox) + Math.abs(w.y - oy) < sp * 0.2) w.wait = 0.3, w.tx = w.x, w.ty = w.y; // stuck: pick somewhere else
                    w.face = w.tx < w.x ? -1 : 1; w.walk += dt * 8;
                }
            }
            if (Math.hypot(p.x - w.x, p.y - w.y) < 34 && G.time - w.said > 6) { w.said = G.time; w.line = (w.line + 1) % w.says.length; }
        }
        // the fountain: its water heals
        const f = G.things.find(t => t.kind === "fountain");
        if (f && Math.hypot(p.x - f.x, p.y - f.y) < 46) { p.hp = Math.min(p.maxHp, p.hp + 30 * dt); p.mana = Math.min(p.maxMana, p.mana + 30 * dt); }
    }

    /* ---------------- 🗺️ out on a road ----------------
       The road's open land (D.regionMap): three zones from the gate up, tougher
       further out; monsters roam in packs near home and come for you when you're
       close (they give up if you run far), back a while after a pack's beaten;
       things to gather grow back. At the far end, the road's boss in its lair —
       walk in and the fight's on (run off and it falls back). Your bag's the
       limit: walk home through the gate to keep it all — fall, and this trip's
       materials are lost. */
    function setupWilds() {
        const road = plan.road, R = D.REGIONS[road], r = rooms[0], ox = (r.x0 + 1.5) * TILE, oy = (r.y0 + 1.5) * TILE, M = D.regionMap(road);
        const W2 = (x, y) => ({ x: ox + x, y: oy + y });
        theme = LOBBY_THEME;
        G.wild = { ox, oy, map: M, packs: [], nodes: [], zone: null, road };
        G.solids = []; G.over2 = []; G.walkers = []; G.trip = {};
        const solid = (x0, y0, x1, y1) => G.solids.push({ x0, y0, x1, y1 });
        const gate = W2(M.gate.x, M.gate.y), camp = W2(M.camp.x, M.camp.y), lair = W2(M.lair.x, M.lair.y);
        Object.assign(G.player, { x: gate.x, y: gate.y - 40, hp: G.player.maxHp, mana: G.player.maxMana });
        G.things.push({ kind: "exit", x: gate.x, y: gate.y });
        G.things.push({ kind: "fire", x: camp.x, y: camp.y, benches: true }, { kind: "merchant", x: camp.x + 40, y: camp.y - 4 }); // (🧙 a wandering merchant sits by the fire)
        G.things.push({ kind: "lair", x: lair.x, y: lair.y, r: M.lair.r, boss: R.boss });
        // the lair as a "room" (tiles) for the boss's attacks
        const lt = M.lair.r / TILE; G.lairRoom = { id: "lair", x0: Math.floor(lair.x / TILE - lt), y0: Math.floor(lair.y / TILE - lt), w: Math.ceil(lt * 2), h: Math.ceil(lt * 2), cx: Math.floor(lair.x / TILE), cy: Math.floor(lair.y / TILE), doors: [] };
        M.obstacles.forEach(o => {
            const p = W2(o.x, o.y);
            if (o.r) { G.things.push({ kind: o.kind === "tree" ? "tree" : "rock", x: p.x, y: p.y, r: o.r, style: road }); if (o.kind === "tree") G.over2.push({ kind: "canopy", x: p.x, y: p.y, style: road }); solid(p.x - o.r * 0.75, p.y - o.r * 0.75, p.x + o.r * 0.75, p.y + o.r * 0.75); }
            else { G.things.push({ kind: o.kind === "pond" ? "pond" : "ruin", x: p.x, y: p.y, w: o.w, h: o.h, style: road }); solid(p.x - o.w / 2, p.y - o.h / 2, p.x + o.w / 2, p.y + o.h / 2); }
        });
        M.nodes.forEach(n => { const p = W2(n.x, n.y), t = { kind: "node", res: n.kind, x: p.x, y: p.y, grown: true, regrow: 0 }; G.wild.nodes.push(t); G.things.push(t); });
        M.props.forEach(o => { const p = W2(o.x, o.y), P = D.PROPS[o.kind]; G.enemies.push({ prop: true, kind: o.kind, x: p.x, y: p.y, r: P.r, hp: P.hp, maxHp: P.hp, room: r.id, flash: 0, spawnT: 0 }); });
        M.packs.forEach((pk, i) => { const p = W2(pk.x, pk.y); G.wild.packs.push({ ...pk, x: p.x, y: p.y, i, respawnAt: null }); spawnPack(i); });
        $("bossBar").hidden = true;
        updateWildsTags(true);
        banner(`${R.icon} ${R.name}`, STORY1.beats[road].goal);
    }
    function spawnPack(i) {
        const pk = G.wild.packs[i];
        pk.types.forEach((type, j) => {
            const a = (j / pk.types.length) * Math.PI * 2, at = { x: pk.x + Math.cos(a) * 18, y: pk.y + Math.sin(a) * 18 };
            spawnEnemy(type, at, 0, pk.elite);
            const e = G.enemies[G.enemies.length - 1];
            Object.assign(e, { wild: true, pack: i, home: { x: at.x, y: at.y }, spawnT: 0.01 });
            e.hp = e.maxHp = e.maxHp * pk.mult; e.dm *= 1 + (pk.mult - 1) * 0.5;
        });
    }
    function updateWildsTags(force) {
        const R = D.REGIONS[G.wild.road], z = D.zoneAt(G.wild.road, G.player.y - G.wild.oy), b = inv();
        if (force || z.name !== G.wild.zone) { G.wild.zone = z.name; $("floorTag").textContent = `${R.icon} ${R.name} · ${z.name}`; }
        const q = G.boss ? `👑 ${G.boss.name}` : `🎒 ${b.items.length}/${b.slots} · 🏘️ the gate takes you home`;
        if ($("questTag").textContent !== q) { $("questTag").textContent = q; $("questTag").classList.toggle("done", false); }
    }
    function updateWilds(dt) {
        const p = G.player, b = inv();
        updateWildsTags();
        for (const n of G.wild.nodes) {
            if (!n.grown) { if (G.time > n.regrow) n.grown = true; continue; }
            if (Math.hypot(p.x - n.x, p.y - n.y) > 15) continue;
            if (D.bagFull(b, n.res)) { if (G.time - (G.fullT || -9) > 4) { G.fullT = G.time; toast("🎒 Your bag's full — head home to fuse, or drop something", 1600); } continue; }
            if (gainItem(n.res)) { n.grown = false; n.regrow = G.time + 60; fxText(n.x, n.y - 12, `+1 ${D.ITEMS[n.res].icon}`, "#9fe08a", true); fxPuff(n.x, n.y, "#9fe08a", 6); }
        }
        const lair = G.things.find(t => t.kind === "lair");
        if (lair) {
            const d = Math.hypot(p.x - lair.x, p.y - lair.y);
            if (!G.boss && !G.lairDone && d < lair.r * 0.7) startBoss(lair);
            else if (G.boss && d > lair.r + 190) { // ran off: it falls back to its lair, healed
                toast(`${G.boss.icon} ${esc(G.boss.name)} falls back to its lair`, 1600);
                G.enemies.forEach(e => { if (e.room === "lair" && !e.dead) e.dead = true; });
                G.hazards = []; G.boss = null; $("bossBar").hidden = true;
            }
        }
        for (const pk of G.wild.packs) {
            if (G.enemies.some(e => e.pack === pk.i && !e.dead)) continue;
            if (pk.respawnAt == null) pk.respawnAt = G.time + 45;
            else if (G.time > pk.respawnAt && Math.hypot(p.x - pk.x, p.y - pk.y) > 320) { pk.respawnAt = null; spawnPack(pk.i); }
        }
    }
    // a screen or sheet over the game: the game waits
    let frozenBy = 0;
    function freeze(on) {
        if (!G) return;
        frozenBy = Math.max(0, frozenBy + (on ? 1 : -1));
        if (on) $("prompt").hidden = true;
        paused = frozenBy > 0 || !$("pauseScreen").hidden;
        if (!paused) last = performance.now();
        input.attack = input.dash = input.use = false;
    }
    function openStation(id) {
        const st = STATIONS.find(x => x.id === id);
        if (st && st.road) return joinRoad(st.road);
        if (id === "shop") return openPanel("shop");
        if (id === "wardrobe") return openPanel("wardrobe");
        if (id === "house") return startRun({ mode: "house", title: "Your house" });
        if (id === "elder") return talkElder();
        if (id === "furnace") return openPanel("fusion");
        if (id === "storage") return openPanel("storage");
        if (id === "bed") { const p = G.player; p.hp = p.maxHp; p.mana = p.maxMana; fxRing(p.x, p.y, 20, "#c99bff", 0.6); return toast("🛏️ A good rest — HP and mana full", 1300); }
        if (id === "door") return startLobby("house");
    }

    /* ---------------- a sheet: set out on a road, buy, a question ---------------- */
    let sheetBtns = [];
    function openSheet(html, btns) {
        sheetBtns = btns || [];
        const card = $("sheetCard");
        card.innerHTML = html + sheetBtns.map((b, i) => `<button type="button" class="${b.main ? "big-btn" : "ghost-btn"}" data-sb="${i}"${b.id ? ` id="${b.id}"` : ""}${b.disabled ? " disabled" : ""}>${b.label}</button>`).join("");
        if ($("sheet").hidden) { $("sheet").hidden = false; freeze(true); }
        card.scrollTop = 0;
    }
    function closeSheet() { if ($("sheet").hidden) return; $("sheet").hidden = true; sheetBtns = []; freeze(false); }
    $("sheetCard").addEventListener("click", (e) => { const b = e.target.closest("[data-sb]"); if (b && !b.disabled) { const f = sheetBtns[+b.dataset.sb]; f && f.go(); } });
    $("sheet").addEventListener("click", (e) => { if (e.target === $("sheet")) closeSheet(); });
    const NOT_NOW = { label: "Not now", go: () => closeSheet() };
    // a boss's colours (its lair's): for the top of its sheet
    /* ⛲ a shard in the fountain, for luck: mostly nothing… sometimes shards
       back, a potion, a blessing for your next run — rarely a jackpot. (It
       gives back fewer shards than it takes: luck, not a money machine.) */
    const WISHES = [
        { p: 0.55, text: "Plop… nothing happens. Maybe next time 🤷" },
        { p: 0.20, gold: 15, text: "✨ The water glows — 🔶 15 float back up!" },
        { p: 0.08, item: "hpPot", text: "❤️ A health potion bobs up to you!" },
        { p: 0.08, item: "mpPot", text: "🔷 A mana potion bobs up to you!" },
        { p: 0.07, buff: "blessed", text: "🌟 The fountain's blessing: +20% luck and +5% crit on your next run!" },
        { p: 0.02, gold: 80, text: "🎉 JACKPOT! 🔶 80 shower out of the fountain!" }
    ];
    function tossCoin(t) {
        if (G.tossing) return;
        if (gold() < 10) return openSheet(`<div class="sheet-hero" style="--c1:#2f6a9a;--c2:#10283c"><span class="big">⛲</span><span><small>The fountain</small><b>You need 🔶 10</b></span></div><p class="sub">You have 🔶 ${fmtN(gold())}. Shards drop from monsters on the roads.</p>`, [{ label: "OK", main: true, go: () => closeSheet() }]);
        save.gold = gold() - 10; writeSave(save);
        G.tossing = true;
        const p = G.player;
        G.fx.push({ kind: "coin", x: p.x, y: p.y - 10, tx: t.x + (rnd() - 0.5) * 10, ty: t.y, t: 0, life: 0.6 });
        setTimeout(() => {
            if (!G || plan.mode !== "lobby") return;
            G.tossing = false;
            fxRing(t.x, t.y, 18, "#8fd8ff", 0.6);
            let r = rnd(), w = WISHES[0];
            for (const x of WISHES) { if (r < x.p) { w = x; break; } r -= x.p; }
            if (w.gold) { save.gold = gold() + w.gold; for (let i = 0; i < Math.min(12, w.gold / 5); i++) fxPuff(t.x, t.y - 10, "#ffd24a", 2); }
            if (w.item) gainItem(w.item);
            if (w.buff) save.buffs = { ...(save.buffs || {}), [w.buff]: true };
            writeSave(save);
            G.lastWish = w.text;
            toast(esc(w.text), 2400);
        }, 700);
    }
    // 🧭 the guide: what's where, and the controls
    function openGuide() {
        openSheet(`<div class="sheet-hero"><span class="big">🧭</span><span><small>The guide</small><b>Welcome to ${esc(STORY1.city)}!</b></span></div>
            <ul><li>👴 <b>Elder Bram</b> (bottom right): the story — where to go next</li><li>🚪 <b>The four gates</b>: the roads out — each opens once the one before it's cleared. Walk home through a road's gate to keep what you found</li>
                <li>🏠 <b>Your house</b> (bottom left): 🔥 the furnace fuses two things (it can fail — then both are lost), 📦 the chest keeps what your bag can't, 🛏️ rest · 🎒 <b>B</b> opens your bag</li>
                <li>🛒 <b>The shop</b>: 🧪 potions and elixirs for 🔶 shards (the Keep's own money), 💰 sell what you find; things to wear for ✨</li><li>🪞 <b>The wardrobe</b>: what you wear is your gear</li><li>⛲ <b>The fountain</b> heals you — and they say a coin brings luck… · 🎯 try your weapon on the dummy</li></ul>
            <h2 style="font-size:1rem">🎮 Controls</h2>${CONTROLS}`, [{ label: "👍 Got it", main: true, go: () => closeSheet() }]);

    /* ---------------- 🛒 the shop · 🪞 the wardrobe ----------------
       Your real things: the shop sells what the Store does, for your ✨ (and
       today's Daily Deals); the wardrobe dresses the look you wear — the
       same as your profile's. Each shows what it does down here. */
    const WARD_SLOTS = ["held", "shoes", "top", "bottom", "hat", "glasses", "neck", "eyes", "mouth", "hair", "pet"];
    const SLOT = Object.fromEntries(C.SLOTS.map(x => [x.id, x]));
    const STAT_KEYS = ["hp", "mana", "def", "speed", "crit", "luck", "dmg"];
    const fmtN = (n) => Math.max(0, Math.floor(n)).toLocaleString("en-US");
    const thing = (id) => C.thingOf(id) || { id, icon: "❔", name: id, rarity: "common" };
    const picOf = (id) => { try { return C.itemPic(id, 48); } catch (e) { return thing(id).icon; } };
    // what changes, from one set of stats to another ("+5 👟 Speed")
    function diffHtml(a, b) {
        const out = STAT_KEYS.map(k => { const d = b[k] - a[k]; if (!d) return ""; const i = D.STAT_INFO[k]; return `<span class="${d < 0 ? "minus" : ""}">${d > 0 ? "+" : "−"}${Math.abs(d)}${i.unit || ""} ${i.icon} ${i.name}</span>`; }).filter(Boolean);
        if (b.weapon !== a.weapon) { const w = D.WEAPONS[b.weapon]; out.push(`<span>${w.icon} ${esc(w.name)}</span>`); }
        if (b.pet !== a.pet) out.push(b.pet ? `<span>🐾 fights with you</span>` : `<span class="minus">no pet</span>`);
        return out.length ? out.join(" · ") : `<span class="same">no change down here</span>`;
    }
    const wearing = (slot, id) => C.cleanOutfit({ base: outfit.base, wear: { ...outfit.wear, [slot]: id || undefined } }, me.items);
    // what a thing does on its own (from nothing in its slot)
    const effectOf = (id) => { const sl = (C.wearOf(id) || {}).slot; return sl ? diffHtml(D.statsOf({ wear: {} }), D.statsOf({ wear: { [sl]: id } })) : ""; };
    let panel = null, shopTab = "supplies", wardOpen = null, wardMsg = "";
    function openPanel(kind, opts) {
        panel = kind;
        if (kind === "shop") shopTab = (opts && opts.tab) || shopTab;
        if (kind === "wardrobe") { wardOpen = (opts && opts.slot) || null; wardMsg = ""; }
        renderPanel();
        if ($("panelScreen").hidden) { $("panelScreen").hidden = false; freeze(true); }
        $("panelScreen").scrollTop = 0;
    }
    function closePanel() { if ($("panelScreen").hidden) return; $("panelScreen").hidden = true; panel = null; freeze(false); }
    function renderPanel() { if (panel === "shop") renderShop(); else if (panel === "wardrobe") renderWardrobe(); else if (panel === "bag") renderBag(); else if (panel === "fusion") renderFusion(); else if (panel === "codex") renderCodex(); else if (panel === "storage") renderStorage(); }
    /* 📦 your chest (40 slots, at home): what your bag can't carry. Tap a stack to move it across. */
    let chestOf = null;
    function chest() { if (chestOf !== save || !save.chest) { save.chest = D.cleanBag({ slots: 40, ...(save.chest || {}) }); save.chest.slots = 40; chestOf = save; } return save.chest; }
    function moveStack(to, id) {
        const from = to === "chest" ? inv() : chest(), dest = to === "chest" ? chest() : inv(), n = D.bagCount(from, id);
        if (!n) return;
        const went = D.bagMoveAll(from, dest, id); // (gear keeps its level)
        if (went < n) toast(to === "chest" ? "📦 Your chest's full" : "🎒 Your bag's full", 1200);
        writeSave(save); renderStorage();
    }
    function renderStorage() {
        const c = chest(), b = inv(), grid = (bag, attr) => `<div class="bag-grid">${Array.from({ length: bag.slots }, (_, i) => { const x = bag.items[i]; if (!x) return `<span class="cell empty"></span>`; const it = D.ITEMS[x.id]; return `<button type="button" class="cell r-${it.rarity}" ${attr}="${x.id}" aria-label="${esc(it.name)}">${iconOf(x.id, 30)}${lvTag(x)}${x.n > 1 ? `<span class="n">${x.n}</span>` : ""}</button>`; }).join("")}</div>`;
        $("panelCard").innerHTML = panelTop(`📦 Your chest · ${c.items.length}/${c.slots}`) + `<p class="sub" style="text-align:left">Tap something to move it across — the chest keeps what your bag can't carry.</p>`
            + `<h2 style="font-size:1rem;text-align:left;margin:4px 0 6px">📦 In the chest</h2>${grid(c, "data-tobag")}`
            + `<h2 style="font-size:1rem;text-align:left;margin:14px 0 6px">🎒 In your bag · ${b.items.length}/${b.slots}</h2>${grid(b, "data-tochest")}`;
    }

    const panelTop = (title) => `<div class="panel-top"><button type="button" class="back" data-p="close" aria-label="Close">←</button><h1>${title}</h1><span class="sd">🔶 ${fmtN(gold())}</span><span class="sd">✨ ${me.signedIn ? fmtN(me.stardust) : "–"}</span></div>`;
    const signInNote = () => me.signedIn ? "" : `<p class="note" style="margin-top:0">🔑 Sign in to shop and dress up — your ✨ and things are on your account. <button type="button" class="chip" data-p="signin">Sign in</button></p>`;
    function renderShop() {

        if (shopTab === "sell") { // what's in your bag, and what the shop pays for one

            const gearRows = b.items.map((x, i) => [x, i]).filter(([x]) => D.isGear(x.id)).map(([x, i]) => { const it = D.ITEMS[x.id], pr = D.sellPrice(x.id, x.lv);
                return `<div class="item"><div class="pic" style="font-size:1.6rem">${iconOf(x.id, 34)}</div><div class="info"><b>${esc(it.name)} <span class="rar">· Lv ${x.lv}</span></b><span class="desc">${RAR(it.rarity)} · a higher level sells for more</span></div><button type="button" class="buy" data-sellbi="${i}">Sell · 🔶 ${pr}</button></div>`; });
            const rows = gearRows.join("") + ids.map(id => { const it = D.ITEMS[id], n = D.bagCount(b, id), pr = D.sellPrice(id);
                return `<div class="item"><div class="pic" style="font-size:1.6rem" data-iinfo="${id}">${iconOf(id, 34)}</div><div class="info" data-iinfo="${id}"><b>${esc(it.name)} <span class="rar">· you have ${n}</span></b><span class="desc">${RAR(it.rarity)} · 🔶 ${pr} each</span></div>
                    <div><button type="button" class="buy" data-sell="${id}">Sell · 🔶 ${pr}</button>${n > 1 ? `<button type="button" class="buy ghost" data-sellall="${id}" style="margin-top:4px">All ${n} · 🔶 ${pr * n}</button>` : ""}</div></div>`; }).join("");
            $("panelCard").innerHTML = panelTop("🛒 Shop") + chips + `<div class="items">${rows || `<p class="sub">Your bag's empty — bring back what you find on the roads.</p>`}</div>`
                + `<p class="note">The shop buys what you find in the Keep, for 🔶 shards. (The Store's things are yours to wear — they can't be sold here.)</p>`;

            const rows = SUPPLIES.map(x => {

                const btn = armed ? `<button type="button" class="buy ghost" disabled>Ready ✓</button>` : full ? `<button type="button" class="buy ghost" disabled>Full</button>` : `<button type="button" class="buy" data-sup="${x.id}">🔶 ${x.price}</button>`;
                return `<div class="item${armed ? " on" : ""}"><div class="pic" style="font-size:1.6rem" data-iinfo="${x.carry ? x.id : ""}">${x.carry ? iconOf(x.id, 34) : x.icon}</div><div class="info"${x.carry ? ` data-iinfo="${x.id}"` : ""}><b>${esc(x.name)}${x.carry ? ` <span class="rar">· in your bag: ${have}</span>` : ""}</b><span class="desc">${esc(x.desc)}</span></div>${btn}</div>`;
            }).join("");
            $("panelCard").innerHTML = panelTop("🛒 Shop") + chips + `<div class="items">${rows}</div>`
                + `<p class="note">🔶 Shards are the Keep's own money (not the app's 🪙 tokens): they drop from monsters and crates out on the roads, the 💰 Sell tab pays them for what you find, and they're kept in your pouch (on this device for now). Clothes and weapons from the Store: 🪞 the wardrobe.</p>`;
        }
    }
    /* 🪞 the wardrobe — and the Store's things: each slot lists what you own
       and what you can buy (✨, today's 🛍️ deals), sorted by what you care

    const WEAPON_KIND = { shot: "shoots", slash: "swings", thrust: "stabs far", orb: "casts orbs that home in", lob: "throws — it bursts", flame: "burns, up close", spin: "throws — it cuts through" };

        if (t.kind === "lost" && !t.taken) { ctx.fillStyle = `rgba(255,210,74,${0.2 + 0.15 * Math.sin(G.time * 5)})`; circle(t.x, t.y, 9, true); emoji(t.icon, t.x, t.y - Math.abs(Math.sin(G.time * 3)) * 2, 10); return; }
        if (t.kind === "cage") {
            if (!t.freed) { emoji("🧑‍🌾", t.x, t.y, 12); ctx.strokeStyle = "#8d97a8"; ctx.lineWidth = 1.6; for (let i = -6; i <= 6; i += 3) { ctx.beginPath(); ctx.moveTo(t.x + i, t.y - 9); ctx.lineTo(t.x + i, t.y + 8); ctx.stroke(); } ctx.fillStyle = "#5a6370"; ctx.fillRect(t.x - 8, t.y - 11, 16, 3); ctx.fillRect(t.x - 8, t.y + 7, 16, 3); }
            else emoji("🙌", t.x, t.y - 4 - Math.abs(Math.sin(G.time * 5)) * 2, 10);
            return;
        }
        if (t.kind === "relic" && !t.taken) { ctx.fillStyle = `rgba(201,155,255,${0.25 + 0.15 * Math.sin(G.time * 5)})`; circle(t.x, t.y, 10, true); emoji("🔮", t.x, t.y - Math.abs(Math.sin(G.time * 3)) * 2, 11); }
    }
    function drawPickup(k) {
        const bob = Math.sin(G.time * 6 + k.x) * 1.2;
        if (k.kind === "weapon") { ctx.fillStyle = "rgba(255,255,255,.12)"; circle(k.x, k.y, 9, true); emoji(D.WEAPONS[k.weapon].icon, k.x, k.y + bob, 11); return; }
        if (k.kind === "potion") return bottle(k.x, k.y + bob, "#ff4f6a");
        if (k.kind === "manaPotion") return bottle(k.x, k.y + bob, "#3a8bff");
        if (k.kind === "mana") { ctx.fillStyle = "#6ab8ff"; ctx.beginPath(); ctx.moveTo(k.x, k.y - 4 + bob); ctx.lineTo(k.x + 3, k.y + bob); ctx.lineTo(k.x, k.y + 4 + bob); ctx.lineTo(k.x - 3, k.y + bob); ctx.fill(); return; }
        if (k.kind === "gold") return shard(k.x, k.y + bob, 3.4);
        if (k.kind === "mat") { ctx.fillStyle = "rgba(255,226,168,.18)"; circle(k.x, k.y + bob, 6, true); return emoji(D.ITEMS[k.id].icon, k.x, k.y + bob, 9); }
        if (k.kind === "recipe") { ctx.fillStyle = "rgba(255,226,122,.22)"; circle(k.x, k.y + bob, 7, true); return emoji("📜", k.x, k.y + bob, 10); }
        const icon = { stardust: "✨", heart: "💗", token: "🪙", gear: "🎁" }[k.kind];
        emoji(icon, k.x, k.y + bob, k.kind === "token" ? 11 : 9);
    }
    function drawFx(f) {
        const k = f.t / f.life;
        if (f.kind === "text") { ctx.globalAlpha = 1 - k; ctx.fillStyle = f.color; ctx.font = `900 ${f.big ? 9 : 7}px system-ui, sans-serif`; ctx.textAlign = "center"; ctx.strokeStyle = "rgba(0,0,0,.6)"; ctx.lineWidth = 2; ctx.strokeText(f.text, f.x, f.y - k * 12); ctx.fillText(f.text, f.x, f.y - k * 12); ctx.globalAlpha = 1; }
        else if (f.kind === "ring") { ctx.globalAlpha = 1 - k; ctx.strokeStyle = f.color; ctx.lineWidth = 2; circle(f.x, f.y, f.r * (0.3 + 0.7 * k), false); ctx.globalAlpha = 1; }
        else if (f.kind === "tele") { ctx.globalAlpha = 0.6 * (1 - k); ctx.fillStyle = f.color; circle(f.x, f.y, f.r * (1 + k), true); ctx.globalAlpha = 1; }
        else if (f.kind === "coin") { const x = f.x + (f.tx - f.x) * k, y = f.y + (f.ty - f.y) * k - Math.sin(k * Math.PI) * 18; shard(x, y, 3.4); }
        else if (f.kind === "dot") { ctx.globalAlpha = 1 - k; ctx.fillStyle = f.color; ctx.fillRect(f.x - 1, f.y - 1, 2, 2); ctx.globalAlpha = 1; }
        else if (f.kind === "swing" || f.kind === "flame") {
            ctx.globalAlpha = 0.75 * (1 - k); ctx.fillStyle = f.kind === "flame" ? "#ff9a3a" : "#e8f2ff";
            ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.arc(f.x, f.y, f.reach, f.a - (f.arc * Math.PI / 360), f.a + (f.arc * Math.PI / 360)); ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
        }
    }
    function drawHud() {
        const p = G.player;
        $("hpFill").style.width = (100 * p.hp / p.maxHp) + "%"; $("hpText").textContent = `${Math.ceil(p.hp)}/${p.maxHp}`;
        $("mpFill").style.width = (100 * p.mana / p.maxMana) + "%"; $("mpText").textContent = `${Math.floor(p.mana)}/${p.maxMana}`;
        const h = hero(); $("xpFill").style.width = (h.lv >= D.HERO.cap ? 100 : 100 * h.xp / D.heroNext(h.lv)) + "%"; $("lvText").textContent = `⭐ Lv ${h.lv}`;
        $("goldTxt").textContent = G.loot.gold; $("sdTxt").textContent = G.loot.stardust; $("hrTxt").textContent = G.loot.hearts; $("tkTxt").textContent = G.loot.tokens;
        $("hrBox").hidden = !G.loot.hearts; $("tkBox").hidden = !G.loot.tokens; // (rare: shown once you find one — room for the 🎒 and ☰)
        const b = inv(), hpN = D.bagCount(b, "hpPot") + D.bagCount(b, "bigHp"), mpN = D.bagCount(b, "mpPot"), bt = [hpN ? `❤️×${hpN}` : "", mpN ? `🔷×${mpN}` : "", ...(plan.mode === "lobby" ? buffsReady() : G.buffs || []).map(k => BUFFS[k].icon)].filter(Boolean).join(" ");
        if ($("bagTag").textContent !== "🎒 " + bt) $("bagTag").textContent = "🎒 " + bt;
        $("bagTag").hidden = !bt;
        if (plan.mode === "lobby") $("walletGold").textContent = gold().toLocaleString("en-US");
        const w = W(); $("weaponTag").textContent = `${w.icon} ${w.name}${w.mana ? ` · 🔷${w.mana}` : ""}`;
        if (G.boss) $("bossFill").style.width = (100 * Math.max(0, G.boss.hp) / G.boss.maxHp) + "%";
        const m = mctx;
        m.clearRect(0, 0, 168, 168);
        if (G.wild) { // the whole road: its zones, you, the gate, the lair, what's grown
            const k = 160 / Math.max(D.WILDS.pw, D.WILDS.ph), mx = (x) => 4 + (x - G.wild.ox) * k, my = (y) => 4 + (y - G.wild.oy) * k + (160 - D.WILDS.ph * k) / 2;
            const RZ = D.REGIONS[G.wild.road].zones;
            [[RZ[0].colors[0], 0.62, 1], [RZ[1].colors[0], 0.3, 0.62], [RZ[2].colors[0], 0, 0.3]].forEach(([c, a, b2]) => { m.fillStyle = c; m.fillRect(4, my(G.wild.oy + a * D.WILDS.ph), D.WILDS.pw * k, (b2 - a) * D.WILDS.ph * k); });
            m.fillStyle = "rgba(90,150,220,.9)"; G.things.forEach(t => { if (t.kind === "pond") m.fillRect(mx(t.x - t.w / 2), my(t.y - t.h / 2), t.w * k, t.h * k); });
            m.fillStyle = "#c9ffb0"; G.wild.nodes.forEach(n => { if (n.grown) m.fillRect(mx(n.x) - 1.5, my(n.y) - 1.5, 3, 3); });
            m.fillStyle = "#ff6b7a"; G.enemies.forEach(e => { if (e.angry && !e.dead) m.fillRect(mx(e.x) - 1.5, my(e.y) - 1.5, 3, 3); });
            const lr = G.things.find(t => t.kind === "lair"); if (lr) { m.font = "14px sans-serif"; m.textAlign = "center"; m.textBaseline = "middle"; m.fillText(G.lairDone && !G.boss ? "✅" : D.BOSSES[lr.boss].icon, mx(lr.x), my(lr.y)); }
            const ex = G.things.find(t => t.kind === "exit"); if (ex) { m.font = "16px sans-serif"; m.textAlign = "center"; m.textBaseline = "middle"; m.fillText("🏘️", mx(ex.x), my(ex.y) - 6); }
            m.fillStyle = "#ffd24a"; m.beginPath(); m.arc(mx(G.player.x), my(G.player.y), 4, 0, Math.PI * 2); m.fill();
            return;
        }
    }

    /* ---------------- the game loop ---------------- */
    let running = false, last = 0, raf = 0, paused = false;
    function loop(ts) {
        if (!running) return;
        const dt = Math.min(0.033, (ts - last) / 1000 || 0); last = ts;
        if (!paused) update(dt);
        draw();
        raf = requestAnimationFrame(loop);
    }
    const CONTROLS = `<div class="controls">
            <span class="k">🕹️</span><span><b>Move</b> — drag anywhere on the left<small>keyboard: WASD or the arrows</small></span>
            <span class="k">⚔️</span><span><b>Attack</b> — hold the red button; it aims for you<small>keyboard: Space or J</small></span>
            <span class="k">💨</span><span><b>Dash</b> — the blue button; slips through attacks<small>keyboard: Shift or K</small></span>
            <span class="k">✋</span><span><b>Use</b> — walk up to a door, the shop, someone or a weapon: it asks <b>✅ Yes / ✖ No</b> — tap one, or ⚔️<small>keyboard: ← → to choose, Space or Enter to pick</small></span>
            <span class="k">🎒</span><span><b>Bag</b> — the 🎒 button: what you've found, your gear<small>keyboard: B</small></span>
            <span class="k">⏸</span><span><b>Pause</b> — this button<small>keyboard: Esc</small></span>
        </div>
        <details class="how"><summary>👕 Your gear, 🔷 mana and the rest</summary>
            <b>Your outfit is your loadout</b>: boots = speed, top = HP, bottom = defense, hat = crit, necklace = luck, hair &amp; glasses = mana, what you hold = your weapon, your pet fights beside you. Rarer = stronger — dress up at 🪞 the wardrobe.<br>
            🔷 <b>Mana</b>: strong weapons cost mana a hit — pick up 🔷 and blue potions; run dry and you fall back on your sling. 🔥 Sit by the camp fire at a road's gate to heal; 🛏️ your bed at home heals you to full. 📦 Break crates and barrels for loot.</details>`;
    function pause() {
        if (!running || G.over) return;
        const lobby = plan.mode === "lobby" || plan.mode === "house", w = W();
        const btns = [["big", "▶ Keep going", () => resume()]];
        if (plan.mode === "wilds") btns.push(["ghost", "🚪 Give up (lose this trip's materials)", () => { $("pauseScreen").hidden = true; endRun(false, true); }]);
        else if (inApp) btns.push(["ghost", "← Back to Games", () => window.parent.postMessage({ kih: "keepClose" }, location.origin)]);
        $("pauseCard").innerHTML = `<h1>${lobby ? `☰ ${esc(STORY1.city)}` : "⏸ Paused"}</h1>
            ${lobby ? `<p class="sub">📜 ${esc(storyGoal())}</p>` : `<div class="pause-quest">${esc($("floorTag").textContent)}<br>${esc($("questTag").textContent)}</div>
            <p class="sub">${w.icon} ${esc(w.name)}${w.mana ? ` · 🔷 ${w.mana} mana a hit` : " · no mana needed"}</p>`}
            <p class="demo-note">🧪 <b>This is a demo</b> — The Keep is still being built, so things in it may change.</p>
            <h2 style="margin:4px 0 0;font-size:1rem;text-align:left">🎮 Controls</h2>${CONTROLS}`
            + btns.map((b, i) => `<button type="button" class="${b[0] === "big" ? "big-btn" : "ghost-btn"}" data-pb="${i}">${b[1]}</button>`).join("");
        $("pauseCard").querySelectorAll("[data-pb]").forEach(el => el.addEventListener("click", () => btns[+el.dataset.pb][2]()));
        $("pauseScreen").hidden = false;
        $("prompt").hidden = true;
        paused = true;
    }
    function resume() { $("pauseScreen").hidden = true; paused = frozenBy > 0; if (!paused) last = performance.now(); }
    $("pauseBtn").addEventListener("click", () => { if (!$("pauseScreen").hidden) resume(); else pause(); });
    $("bagBtn").addEventListener("click", () => { if (running && !G.over && $("pauseScreen").hidden) openPanel("bag"); });

    /* ---------------- the end of a run ---------------- */
    function endRun(won, quit) {
        if (G.over) return;
        G.over = true;
        closeTalk();
        $("prompt").hidden = true;
        const lost = [];
        if (plan.mode === "wilds" && !won) Object.entries(G.trip || {}).forEach(([id, n]) => { const k = Math.min(n, D.bagCount(inv(), id)); if (k && D.bagTake(inv(), id, k)) lost.push([id, k]); });
        save.gold = gold() + Math.max(0, G.loot.gold); writeSave(save); // 🔶 kept, win or lose
        setTimeout(() => {
            running = false; cancelAnimationFrame(raf);
            const L = G.loot, mins = Math.floor(G.time / 60), secs = Math.floor(G.time % 60);
            const tally = `<div class="tally"><span>✨ ${L.stardust} Stardust</span><span>💗 ${L.hearts} hearts</span><span>🪙 ${L.tokens} tokens</span><span>🔶 ${L.gold} shards → your pouch (${gold().toLocaleString("en-US")})</span>${L.gear ? `<span>🎁 ${L.gear} gear</span>` : ""}</div>`;
            const time = `${mins}:${String(secs).padStart(2, "0")} · ${G.kills} defeated`;
            let html, btns = [];
            const finds = (list) => list.length ? `<div class="tally">${list.map(([id, n]) => `<span>${iconOf(id, 18)} ${n} ${esc(D.ITEMS[id].name)}</span>`).join("")}</div>` : "";
            const R = D.REGIONS[plan.road], got = Object.entries(G.trip || {}), road = plan.road;
            html = won ? `<h1>🏘️ Back in ${esc(STORY1.city)}</h1><p class="sub">${R.icon} ${esc(R.name)} · ${time} · what you found is in your bag</p>${finds(got) || `<p class="sub">You came back empty-handed.</p>`}`
                : `<h1>${quit ? "🚪 You gave up" : `💀 You fell on the ${R.dir.toLowerCase()} road`}</h1><p class="sub">${time} · this trip's materials are lost</p>${finds(lost) || `<p class="sub">You hadn't found anything yet.</p>`}`;
            btns.push(["big", `⚔️ Set out again (${R.icon} ${R.dir.toLowerCase()})`, () => playRoad(road)]);
            btns.push(["ghost", "🎒 Open your bag", () => { startLobby(road); openPanel("bag"); }]);
            btns.push(["ghost", `🏘️ Back to ${esc(STORY1.city)}`, () => startLobby(plan.road)]);
            $("endCard").innerHTML = html + tally + btns.map((b, i) => `<button type="button" class="${b[0] === "big" ? "big-btn" : "ghost-btn"}" data-b="${i}">${b[1]}</button>`).join("")
                + `<p class="note">🧪 This is a demo — The Keep is still being built. What you pick up stays in the Keep for now — ✨ 💗 🪙 aren't added to your account yet (but each new rare or better thing for your 📖 collection is +${D.FIND_TOKENS} 🪙 in your account${me.signedIn ? "" : " once you sign in"}). Tell us what you think!</p>`;
            $("endCard").querySelectorAll("[data-b]").forEach(el => el.addEventListener("click", () => btns[+el.dataset.b][2]()));
            $("endScreen").hidden = false;
        }, won ? 600 : 900);
    }

    makeHeroImg(); startLobby(); loadMe();
    // (for tests: look inside a run)
    window.KeepDebug = { get G() { return G; }, get stats() { return stats; }, get rooms() { return rooms; }, get floor() { return floorIdx; }, get layout() { return layout; }, get plan() { return plan; },
        get save() { return save; }, inv, chest, gear, gainItem, openPanel, playRoad, spawnPack, story, roadOpen, get me() { return me; }, get outfit() { return outfit; }, roomPx, startLobby, openStation, D, isSolid: (x, y) => solidAt(x, y) };
})();
</script>
