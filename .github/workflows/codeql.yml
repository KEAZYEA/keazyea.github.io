# GitHub's own security scanner (free for public repos). It reads the code for
# things like unsafe HTML building (XSS) or risky URL handling, and lists what
# it finds under the repo's Security tab → Code scanning. It doesn't block merges.
name: CodeQL security scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # every Monday

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Scan JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
