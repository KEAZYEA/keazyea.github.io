                        btn.textContent = "Retry";
                        const msg = e && e.message && e.message !== "__RESTRICTED__" ? e.message : "Couldn't send.";
                        row.title = msg;
                        alert(msg);
                    }
                };
                list.appendChild(row);
            });
        }

        /* ================================================================
           🔥 ENDLESS RUNS — the free-play tabs. Keep going until you miss.
           Signed in: played on the server (api/games.js) — answers never
           reach this page, and your best run this week goes on the weekly
           leaderboard. Signed out, or replaying a friend's run: played here
           with the very same rules (games-core.js), unranked.
           ================================================================ */
        let runUi = null;    // the run on screen
        let runTimer = null;
        // Each game's latest run, kept while you look at other tabs: its clock
        // keeps going (the server's does anyway), and coming back picks it up
        // where you left it instead of starting a new one.
        const runs = {};
        const liveRun = (ui) => runs[ui.game] === ui; // not replaced by a newer run
        const paintRun = (ui, keepFocus) => { if (runUi === ui) renderRun(keepFocus); };
        const newSeed = () => Math.floor(Math.random() * 2 ** 31);
        const runIsStreak = (g) => g === "trivia" || g === "hilo";
        const runScoreLabel = (g, n) => (runIsStreak(g) ? `a streak of ${n}` : `${n} point${n === 1 ? "" : "s"}`);
        const localBestKey = (g) => "kih_games_run_best_" + g;
        // (a best from before runs stopped at C.LB_CAP can be higher)
        function localBest(g) { try { return Math.min(C.LB_CAP, parseInt(localStorage.getItem(localBestKey(g)) || "0", 10) || 0); } catch (e) { return 0; } }
        // ⭐ Today's double-points game: whichever game is Today's Puzzle
        // (Singapore day, like the server). Its tab wears a "×2".
        const bonusGame = () => C.bonusGameFor(dayKey());
        function markBonusTab() {
            const g = bonusGame();
            document.querySelectorAll(".games-tabs .tab-btn").forEach(b => {
                const on = b.dataset.tab === g;
                b.classList.toggle("bonus", on);
                b.title = on ? "⭐ Today's Puzzle game — double leaderboard points today" : "";
            });
        }
        setInterval(markBonusTab, 60000); // it moves on at midnight
        function saveLocalBest(g, n) { try { if (n > localBest(g)) localStorage.setItem(localBestKey(g), String(n)); } catch (e) { } }

        // Taking the run off screen (another tab, today's puzzle). It isn't
        // stopped: an answer on its way still lands, and its clock runs on.
        function hideRun() {
            clearInterval(runTimer);
            runTimer = null;
            runUi = null;
        }
        function showRun(ui) {
            hideRun();
            runUi = ui;
            renderRun();
            runTimer = setInterval(tickRun, 250);
        }
        // A small dot on the tab of each game with a run still going.
        function markRunTabs() {
            C.GAMES.forEach(g => {
                const btn = document.querySelector(`.games-tabs [data-tab="${g}"]`);
                if (btn) btn.classList.toggle("run-live", !!(runs[g] && !runs[g].over && !runs[g].starting));
            });
        }
        function runViewFits(id, view) {
            if (!view || typeof view !== "object") return false;
            if (id === "guess") return Array.isArray(view.mask) && Array.isArray(view.letters);
            if (id === "blur") return Array.isArray(view.mask) && Array.isArray(view.wrong) && !!(view.image || view.img);
            return true;
        }
        async function signedInAppState() {
            try {
                const AS = await appStateReady();
                await AS.waitForAuthReady();
                return AS.getCurrentUser() && typeof AS.gamesRunStart === "function" ? AS : null;
            } catch (e) { return null; }
        }

        // Opening a game's tab: its run if one is going (or just ended and you
        // haven't seen how), otherwise a new one. opts: { fresh } for Play
        // again; { seed, challenge } to replay a friend's run (never ranked).
        async function startRun(id, opts = {}) {
            const kept = runs[id];
            if (kept && !opts.fresh && !opts.challenge && !(kept.over && kept.seenOver)) { showRun(kept); return; }
            const ui = { game: id, starting: true, ranked: false, challenge: opts.challenge || null, score: 0, best: 0, over: false, view: null, feedback: null, typed: "", msg: "", note: "", busy: false, holding: false, unitNo: 1 };
            runs[id] = ui;
            markRunTabs();
            showRun(ui);
            let resp = null;
            if (!ui.challenge) {
                const AS = await signedInAppState();
                if (!liveRun(ui)) return;
                if (AS) {
                    try {
                        resp = await AS.gamesRunStart(id);
                        // A server still on older rules sends a puzzle this page can't
                        // draw (e.g. the old picture guess) — play it here instead.
                        if (!runViewFits(id, resp && resp.view)) throw new Error("server out of date");
                        ui.ranked = true;
                        ui.runId = resp.runId;
                        // the server decides (its clock, near midnight) — and an older one never doubles
                        ui.bonus = resp.bonus === true;
                    } catch (e) {
                        resp = null;
                        ui.note = "Couldn't reach the leaderboard just now — this run isn't ranked.";
                    }
                    if (!liveRun(ui)) return;
                } else {
                    ui.note = "signin";
                }
            }
            if (!resp) {
                ui.local = C.runNew(id, opts.seed != null ? opts.seed : newSeed(), Date.now());
                resp = { score: 0, over: false, deadline: ui.local.deadline, now: Date.now(), view: C.runView(UNITS, ui.local), best: ui.challenge ? 0 : localBest(id) };
            }
            ui.bestBefore = Math.min(C.LB_CAP, resp.best || 0);
            ui.pts = ui.ptsBefore = resp.pts || 0; // this game's points on the board this week
            ui.starting = false;
            applyRunResp(ui, resp, true);
        }
        function runIntro(ui) {
            const note = ui.starting ? "" : ui.challenge ? "⚔️ A friend's challenge — the same run they played. Not ranked."
                : ui.ranked && ui.bonus ? `⭐ Today's Puzzle game — runs you start today count <b>double</b> on the leaderboard (${C.LB_CAP} points = ${C.LB_GAME_MAX}).`
                : ui.ranked ? `🏆 Ranked — your best run this week counts on the weekly leaderboard: your score is your points (up to ${C.LB_CAP}).`
                : ui.note === "signin" ? "Sign in to put your runs on the weekly leaderboard." : esc(ui.note);
            return `${INTROS[ui.game].free}${note ? `<small>${note}</small>` : ""}`;
        }

        // One move: an answer, a pick, a guess, a hint — or null when time runs out.
        /* ---------------- leaving a run ----------------
           A run you've made a move in ends when you leave it — another tab,
           another part of the site, closing the page — after "Leave this
           game?". A ranked run's best so far has already counted. */
        const runInProgress = (ui) => !!(ui && !ui.over && !ui.starting && ui.moved);
        window.gamesRunInProgress = () => runInProgress(runUi);
        function endRun(ui) {
            if (!ui || ui.over) return;
            clearTimeout(ui.holdTimer);
            // The server ends it too (a move of "nothing" is time up).
            if (ui.ranked && ui.runId && window.AppState) window.AppState.gamesRunAnswer(ui.runId, null).catch(() => { });
            ui.over = true;
            ui.abandoned = true;
            if (runs[ui.game] === ui) delete runs[ui.game];
            if (runUi === ui) hideRun();
            if (ui.ranked) lbLoadedAt = 0;
            markRunTabs();
        }
        function askLeaveRun(ui) {
            const what = runScoreLabel(ui.game, ui.score);
            document.getElementById("leaveText").innerHTML = ui.ranked
                ? `Your run ends now, at <b>${esc(what)}</b>. Your best this week still counts on the leaderboard.`
                : `Your run ends now, at <b>${esc(what)}</b>.`;
            const modal = $("leaveModal");
            modal.classList.add("open");
            return new Promise(resolve => {
                const done = (ok) => { modal.classList.remove("open"); resolve(ok); };
                $("leaveStayBtn").onclick = () => done(false);
                $("leaveGoBtn").onclick = () => done(true);
                modal.onclick = (e) => { if (e.target === modal) done(false); };
            });
        }
        // true = go ahead (the run, if any, is ended); false = stay. index.html
        // asks this too before taking you out of Games.
        async function confirmLeaveRun() {
            const ui = runUi;
            if (!ui || ui.over) return true;
            if (!runInProgress(ui)) { endRun(ui); return true; }
            if (!(await askLeaveRun(ui))) return false;
            endRun(ui);
            return true;
        }
        window.confirmLeaveRun = confirmLeaveRun;
        // Games opened on its own (not inside the site): the browser asks
        // before closing or reloading mid-run.
        if (window.top === window) {
            window.addEventListener("beforeunload", (e) => { if (runInProgress(runUi)) { e.preventDefault(); e.returnValue = ""; } });
        }

        async function runMove(input) {
            const ui = runUi;
            if (!ui || ui.starting || ui.busy || ui.over || ui.holding) return;
            if (input) ui.moved = true;
            ui.busy = true;
            ui.msg = "";
            ui.error = null;
            ui.inflight = input;
            showPending(ui, input);
            let resp;
            try {
                if (ui.ranked) {
                    resp = await window.AppState.gamesRunAnswer(ui.runId, input);
                } else {
                    const s = C.runStep(UNITS, ui.local, input, Date.now(), 0);
                    ui.local = s.run;
                    resp = { score: s.run.score, over: s.run.over, feedback: s.feedback, deadline: s.run.deadline, now: Date.now(),
                        view: s.run.over ? null : C.runView(UNITS, s.run), seed: s.run.over ? s.run.seed : undefined, best: Math.max(ui.bestBefore, s.run.score) };
                }
            } catch (e) {
                if (!liveRun(ui)) return;
                ui.busy = false;
                ui.inflight = null;
                ui.queue = [];
                if (ui.ranked && (!e.status || e.status >= 500)) ui.error = { message: e.message || "Connection problem.", input };
                else if (e.status === 409) { ui.over = true; ui.feedback = ui.feedback || {}; markRunTabs(); }
                else ui.msg = esc(e.message || "That didn't work.");
                paintRun(ui, true);
                return;
            }
            if (!liveRun(ui)) return;
            ui.busy = false;
            ui.inflight = null;
            applyRunResp(ui, resp, false);
            // Hangman letters tapped while that one was on its way go next.
            if (ui.queue && ui.queue.length) {
                if (ui.over || ui.holding) ui.queue = [];
                else runMove({ letter: ui.queue.shift() });
            }
        }
        // The tap shows straight away — the button you pressed lights up while
        // the answer is checked — instead of the whole board greying out.
        function showPending(ui, input) {
            const card = document.querySelector("#gameArea .game-card");
            if (!card || !input) return;
            if (ui.game !== "guess") card.classList.add("waiting");
            let el = null;
            if (input.answer != null) el = card.querySelectorAll(".opt-list .opt-btn")[input.answer];
            else if (input.pick) el = card.querySelector(`.hilo-card[data-key="${input.pick}"]`);
            else if (input.letter) el = card.querySelector(`.hang-key[data-l="${input.letter}"]`);
            else if (input.guess) card.querySelectorAll("input, .guess-input-row button, .suggestions button").forEach(x => { x.disabled = true; });
            if (el) { el.classList.add("pending"); if (input.letter) el.disabled = true; }
        }
        function retryRunMove() {
            if (!runUi || !runUi.error) return;
            const { input } = runUi.error;
            runUi.error = null;
            runMove(input);
        }

        function applyRunResp(ui, resp, first) {
            ui.skew = (resp.now || Date.now()) - Date.now();
            ui.deadline = resp.deadline;
            ui.gained = resp.score > ui.score;
            ui.score = resp.score;
            ui.over = resp.over;
            ui.best = Math.min(C.LB_CAP, Math.max(ui.best, resp.best || 0, ui.challenge ? 0 : ui.score));
            if (resp.seed != null) ui.seed = resp.seed;
            if (typeof resp.pts === "number") ui.pts = resp.pts;
            markRunTabs();
            if (first) { ui.view = resp.view; paintRun(ui); return; }
            const fb = resp.feedback || {};
            ui.feedback = fb;
            if (ui.over) {
                // ranked: a better score, or more points on the board (a doubled run can do that with a lower score)
                ui.newBest = ui.ranked ? !!resp.newBest || (ui.score > ui.bestBefore && ui.score > 0) || ui.pts > ui.ptsBefore : !ui.challenge && ui.score > ui.bestBefore;
                if (!ui.ranked && !ui.challenge) saveLocalBest(ui.game, ui.score);
                if (ui.game === "unitle") ui.reveal = { rows: fb.solved ? fb.guesses : [...ui.view.guesses.map(g => g.key), ...(fb.lastGuess ? [fb.lastGuess] : [])], answer: fb.answer };
                if (ui.game === "guess" || ui.game === "blur") ui.reveal = { answer: fb.answer };
                paintRun(ui);
                if (ui.ranked) lbLoadedAt = 0; // the leaderboard tab fetches fresh next time
                if (runUi === ui) setTimeout(() => { const o = document.querySelector(".run-over"); if (o) o.scrollIntoView({ behavior: "smooth", block: "nearest" }); }, 60);
                return;
            }
            // Show what just happened, then move on to the next one.
            let hold = 0;
            if (runIsStreak(ui.game)) hold = 800;
            else if (fb.solved) {
                hold = 1300;
                ui.reveal = { rows: fb.guesses, answer: fb.answer, points: fb.points, tries: fb.tries, misses: fb.misses };
            }
            if (!hold) {
                ui.view = resp.view;
                ui.feedback = null;
                ui.missFlash = ui.game === "guess" && fb.letter && !fb.hit; // the tiles give a little shake
                if (fb.wrong && fb.guess) ui.msg = `❌ Not ${esc(fb.guess.name)}`;
                paintRun(ui, true);
                return;
            }
            ui.holding = true;
            paintRun(ui);
            ui.holdTimer = setTimeout(() => {
                if (!liveRun(ui)) return;
                ui.holding = false;
                ui.view = resp.view;
                ui.feedback = null;
                if (ui.reveal && ui.reveal.points) ui.unitNo++;
                ui.reveal = null;
                ui.gained = false;
                paintRun(ui, true);
            }, hold);
        }

        function fmtClock(ms) {
            const s = Math.ceil(ms / 1000);
            return s >= 60 ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}` : `${s}s`;
        }
        function tickRun() {
            const ui = runUi;
            if (!ui || ui.over || ui.starting) return;
            const total = C.RUN_LIMIT_MS[ui.game];
            const left = ui.deadline - (Date.now() + (ui.skew || 0));
            const shown = Math.max(0, Math.min(total, left));
            const fill = $("runTimerFill"), text = $("runTimerText");
            if (fill) { fill.style.transform = `scaleX(${shown / total})`; fill.classList.toggle("low", shown < total * 0.25); }
            if (text) text.textContent = ui.holding ? "" : `⏱ ${fmtClock(shown)}`;
            if (left <= 0 && !ui.busy && !ui.holding && !ui.error) runMove(null);
        }

        function renderRun(keepFocus) {
            const ui = runUi;
            if (!ui) return;
            setIntro(runIntro(ui));
            if (ui.starting) { $("gameArea").innerHTML = `<div class="game-card"><p class="dim" style="text-align:center;">Starting…</p></div>`; return; }
            if (ui.over) ui.seenOver = true;
            const tag = ui.challenge ? `<span class="run-tag challenge">⚔️ Challenge</span>`
                : ui.ranked ? `<span class="run-tag ranked">🏆 Ranked</span>` : `<span class="run-tag">Unranked</span>`;
            const head = `${ui.challenge ? `<div class="challenge-bar">⚔️ Your friend's score: <b>${esc(challengeLabel(ui.challenge))}</b> — beat it!</div>` : ""}
                <div class="run-bar"><span class="run-score${ui.gained ? " bump" : ""}">🔥 ${ui.score}<small>/${C.LB_CAP}</small></span><span class="run-best">${ui.challenge ? "" : ui.ranked ? `On the leaderboard: <b>${ui.pts || 0}</b>` : `Your best: <b>${ui.best}</b>`}</span>${ui.ranked && ui.bonus ? `<span class="run-tag bonus" title="Today's Puzzle game: double leaderboard points">⭐ ×2 = ${ui.score * 2}</span>` : ""}${tag}</div>
                ${ui.over ? "" : `<div class="run-timer"><div class="run-timer-fill" id="runTimerFill"></div></div><div class="run-timer-text" id="runTimerText"></div>`}`;
            const body = { trivia: runTriviaBody, hilo: runHiloBody, unitle: runUnitleBody, guess: runGuessBody, blur: runBlurBody }[ui.game]();
            const err = ui.error ? `<div class="reward-box">${esc(ui.error.message)}<br><button class="btn-primary" onclick="retryRunMove()">Try again</button></div>` : "";
            $("gameArea").innerHTML = `<div class="game-card">${head}${body}${err}${ui.over ? runOverHtml() : ""}</div>`;
            tickRun();
            const input = $("runBlurInput") || $("runUnitleInput");
            if (keepFocus && input && !ui.over) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
        }

        function runTriviaBody() {
            const ui = runUi, v = ui.view, fb = ui.feedback;
            const locked = !!fb || ui.busy || ui.over;
            const opts = v.options.map((o, k) => {
                const unit = v.unitOptions ? UNITS.find(u => u.name === o) : null;
                let cls = "";
                if (fb && k === fb.answer) cls = " correct";
                else if (fb && k === fb.picked) cls = " wrong";
                const extra = fb && fb.reveal ? `<span class="opt-extra">${esc(fb.reveal[k])}</span>` : "";
                return `<button class="opt-btn${cls}" onclick="runMove({ answer: ${k} })"${locked ? " disabled" : ""}>${unit ? `<img src="${esc(thumb(unit.img))}" alt="" ${THUMB_FALLBACK}>` : ""}<span>${esc(o)}</span>${extra}</button>`;
            }).join("");
            const banner = fb && fb.correct ? `<div class="run-banner good">✅ Right! +1</div>` : "";
            return `${v.img ? `<div class="game-q-pic"><img src="${esc(v.img)}" alt=""></div>` : ""}<p class="game-q">${v.q}</p><div class="opt-list">${opts}</div>${banner}`;
        }

        function runHiloBody() {
            const ui = runUi, v = ui.view, fb = ui.feedback;
            const stat = C.HILO_STATS.find(s => s.key === v.stat);
            const card = (key) => {
                const u = unitByKey(key);
                let cls = "";
                if (fb) cls = key === fb.winner ? " correct" : key === fb.picked ? " wrong" : "";
                return `<button class="hilo-card${cls}" data-key="${key}" onclick="runMove({ pick: '${key}' })"${fb || ui.busy || ui.over ? " disabled" : ""}>
                    <img src="${esc(u.img)}" alt=""><span class="hilo-name">${esc(u.name)}</span>
                    <span class="hilo-val">${fb ? fmt(fb.values[key]) : "?"}</span></button>`;
            };
            const banner = fb && fb.correct ? `<div class="run-banner good">✅ Right! +1</div>` : "";
            return `<p class="game-q" style="text-align:center;">Which has more <b>${stat.label}</b>?</p><div class="hilo-pair">${card(v.a)}${card(v.b)}</div>${banner}`;
        }

        function unitleRowsHtml(rows) {
            return rows.map(r => {
                const u = unitByKey(r.key);
                return `<div class="unitle-name-line">${esc(u.name)}</div><div class="unitle-row"><div class="unitle-cell name"><img src="${esc(thumb(u.img))}" alt="" ${THUMB_FALLBACK}></div>
                    ${r.cells.map(([c, label, arrow]) => `<div class="unitle-cell ${c}"><span>${esc(label)}</span>${arrow ? `<span>${arrow}</span>` : ""}</div>`).join("")}</div>`;
            }).join("");
        }
        function runUnitleBody() {
            const ui = runUi;
            let rows;
            if (ui.reveal) {
                const t = unitByKey(ui.reveal.answer.key);
                rows = ui.reveal.rows.map(k => ({ key: k, cells: C.unitleCells(unitByKey(k), t) }));
            } else rows = ui.view.guesses;
            const solved = ui.reveal && ui.reveal.points ? `<div class="run-banner good">🎉 Found <b>${esc(ui.reveal.answer.name)}</b> in ${ui.reveal.tries}! +${ui.reveal.points}</div>` : "";
            const input = ui.over || ui.holding ? "" : `<div class="guess-input-row" style="margin-top:10px;">
                    <input type="text" id="runUnitleInput" placeholder="Guess a troop or hero…" autocomplete="off"
                        oninput="showRunSuggestions(this.value)" onkeydown="if(event.key==='Enter') submitRunUnitle();">
                    <button class="btn-primary" style="padding:0 16px; font-weight:700;" onclick="submitRunUnitle()">Guess</button>
                </div>
                ${ui.msg ? `<p class="guess-msg">${ui.msg}</p>` : ""}
                <div class="suggestions" id="runUnitleSuggestions"></div>`;
            return `<div class="game-progress"><span>Unit ${ui.unitNo} · guess ${Math.min(rows.length + (ui.over || ui.holding ? 0 : 1), C.UNITLE_TRIES)} of ${C.UNITLE_TRIES}</span><span>${ui.over ? "" : "find it to keep going"}</span></div>
                <div class="unitle-head"><span>Unit</span><span>Type</span><span>Rarity</span><span>Faction</span><span>Fights</span><span>Max HP</span><span>Max ATK</span></div>
                ${rows.length ? unitleRowsHtml(rows) : `<p class="dim" style="text-align:center; font-size:0.9rem;">Make your first guess below.</p>`}
                ${solved}${input}
                <p class="unitle-legend">🟩 match · 🟥 no match · 🟨 close — ⬆️ the answer is higher / rarer, ⬇️ lower. HP and attack are at max level.</p>`;
        }
        function showRunSuggestions(text) {
            const box = $("runUnitleSuggestions");
            if (!box || !runUi) return;
            const q = C.normName(text);
            if (!q) { box.innerHTML = ""; return; }
            const guessed = new Set(runUi.view.guesses.map(g => g.key));
            const matches = UNITS.filter(u => !guessed.has(u.key) && C.normName(u.name).includes(q)).slice(0, 6);
            box.innerHTML = matches.map(u => `<button type="button" onclick="runMove({ guess: '${u.key}' })"><img src="${esc(thumb(u.img))}" alt="" loading="lazy" ${THUMB_FALLBACK}>${esc(u.name)}</button>`).join("")
                || `<span class="dim" style="font-size:0.88rem;">No troop or hero matches that.</span>`;
        }
        function submitRunUnitle() {
            const input = $("runUnitleInput");
            if (!input || !runUi || !C.normName(input.value)) return;
            const q = C.normName(input.value);
            const guessed = new Set(runUi.view.guesses.map(g => g.key));
            const named = C.resolveName(UNITS, input.value, ALIASES);
            const matches = UNITS.filter(u => !guessed.has(u.key) && C.normName(u.name).includes(q));
            const unit = named && !guessed.has(named.key) ? named : (matches.length === 1 ? matches[0] : null);
            if (!unit) { showRunSuggestions(input.value); return; }
            runMove({ guess: unit.key });
        }

        function runGuessBody() {
            const ui = runUi, v = ui.view, fb = ui.feedback || {};
            const solved = ui.reveal && ui.reveal.points;
            const answer = ui.reveal && ui.reveal.answer;
            // the last letter ended it: count it, and show it on the board
            const lastMiss = ui.over && fb.letter && !fb.hit ? 1 : 0;
            const tried = v ? v.letters.concat(ui.over && fb.letter && !v.letters.includes(fb.letter) ? [fb.letter] : []) : [];
            const wrongCount = solved ? ui.reveal.misses : (v ? v.wrong.length : 0) + lastMiss;
            const name = answer ? answer.name : null;
            const mask = name ? C.hangMask(name, solved ? [...C.nameLetters(name)] : tried) : v.mask;
            const banner = solved ? `<div class="run-banner good hang-solved"><img src="${esc(answer.img)}" alt="" decoding="async">🎉 It's <b>${esc(answer.name)}</b>! +${ui.reveal.points}</div>` : "";
            const pending = (ui.queue || []).concat(ui.inflight && ui.inflight.letter ? [ui.inflight.letter] : []);
            const keys = ui.over || ui.holding ? "" : hangKeys(v.letters, v.wrong, "runLetter", false, pending);
            return `<div class="game-progress"><span>Unit ${ui.unitNo}</span><span>${ui.over ? "" : "solve it to keep going"}</span></div>
                ${hangHeader(wrongCount, ui.over && !solved, v ? v.clue : "")}
                <div class="name-tiles${name ? " done" : ""}${ui.missFlash ? " shake" : ""}">${hangTiles(mask, ui.over && name ? name : null)}</div>
                ${banner}${keys}`;
        }
        function runLetter(L) {
            const ui = runUi;
            if (!ui || ui.game !== "guess" || !ui.view || ui.over || ui.holding || ui.error || ui.view.letters.includes(L)) return;
            if (ui.busy) {
                // still waiting on the last letter: line this one up, and show it now
                ui.queue = ui.queue || [];
                if ((ui.inflight && ui.inflight.letter === L) || ui.queue.includes(L)) return;
                ui.queue.push(L);
                const el = document.querySelector(`#gameArea .hang-key[data-l="${L}"]`);
                if (el) { el.classList.add("pending"); el.disabled = true; }
                return;
            }
            runMove({ letter: L });
        }
        function runBlurBody() {
            const ui = runUi, v = ui.view;
            let picture;
            if (ui.reveal) picture = `<img class="flat" src="${esc(ui.reveal.answer.img)}" alt="" style="object-position:top;">`;
            else if (v.image) picture = `<img class="flat" src="${v.image}" alt="Mystery unit" draggable="false">`;
            else picture = `<img src="${esc(v.img)}" alt="Mystery unit" draggable="false" style="transform:scale(${v.picture.zoom}); transform-origin:${v.picture.focus[0]}% ${v.picture.focus[1]}%; filter:blur(${v.picture.blur}px);">`;
            const tiles = ui.reveal ? nameTiles(ui.reveal.answer.name, false, true) : tilesFromMask(v.mask, ui.typed);
            const over = !ui.reveal && letterCount(ui.typed) > maskLetters(v.mask);
            const solved = ui.reveal && ui.reveal.points ? `<div class="run-banner good">🎉 It's <b>${esc(ui.reveal.answer.name)}</b>! +${ui.reveal.points}</div>` : "";
            const controls = ui.over || ui.holding ? "" : `<form class="guess-input-row" onsubmit="event.preventDefault(); submitRunBlur();">
                    <input type="text" id="runBlurInput" placeholder="Type the troop or hero's name" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" enterkeyhint="go"
                        value="${esc(ui.typed)}" oninput="onBlurTyping(this.value)">
                    <button class="btn-primary" type="submit" style="padding:0 16px; font-weight:700;">Guess</button>
                </form>
                ${ui.msg ? `<p class="guess-msg">${ui.msg}</p>` : ""}
                <div class="game-actions">${runHintButton(v)}</div>`;
            const wrongNames = (v ? v.wrong : []).map(k => "❌ " + esc(unitByKey(k).name)).join(" · ");
            return `<div class="game-progress"><span>Unit ${ui.unitNo} · guess ${Math.min((v ? v.wrong.length : 0) + 1, C.BLUR_GUESSES)} of ${C.BLUR_GUESSES}</span><span>${ui.over ? "" : "name it to keep going"}</span></div>
                <div class="guess-frame">${picture}</div>
                <div class="name-tiles${over ? " over" : ""}"${ui.over || ui.holding ? "" : ` onclick="const i = document.getElementById('runBlurInput'); if (i) i.focus();"`}>${tiles}</div>
                ${v && v.hints.length && !ui.reveal ? `<ul class="hint-list">${v.hints.map((h, i) => `<li>💡 Hint ${i + 1}: ${h}</li>`).join("")}</ul>` : ""}
                ${ui.reveal ? "" : `<div class="wrong-guesses">${wrongNames}</div>`}
                ${solved}${controls}`;
        }
        // Hints come from the run's pool of RUN_BLUR_HINTS — used ones are gone
        // for the rest of the run. Still at most BLUR_HINTS on one unit.
        function runHintButton(v) {
            const left = v.hintsLeft == null ? C.RUN_BLUR_HINTS : v.hintsLeft;
            const maxed = v.hints.length >= C.BLUR_HINTS;
            const label = left <= 0 ? "💡 No hints left this run" : maxed ? "💡 No more hints for this one" : `💡 Use a hint · ${left} left this run`;
            return `<button class="btn-ghost hint-btn" onclick="runMove({ hint: true })"${left <= 0 || maxed ? " disabled" : ""}>${label}</button>
                <span class="hint-pips" aria-label="${left} of ${C.RUN_BLUR_HINTS} hints left">${Array.from({ length: C.RUN_BLUR_HINTS }, (_, i) => `<i class="${i < left ? "on" : ""}"></i>`).join("")}</span>`;
        }
        function submitRunBlur() {
            const input = $("runBlurInput");
            if (!input || !runUi) return;
            const text = input.value.trim();
            if (!text) return;
            runUi.typed = input.value;
            const unit = findUnit(text);
            if (!unit) {
                runUi.msg = `🤔 No troop or hero called “${esc(text)}” — check the spelling. That didn't use a guess.`;
                renderRun(true);
                return;
            }
            if (runUi.view.wrong.includes(unit.key)) {
                runUi.msg = `You already guessed ${esc(unit.name)}.`;
                renderRun(true);
                return;
            }
            runUi.typed = "";
            runMove({ guess: unit.key });
        }

        function runOverHtml() {
            const ui = runUi, fb = ui.feedback || {};
            const timedOut = fb.timedOut && (runIsStreak(ui.game) ? fb.picked == null : !fb.lastGuess);
            // Reaching C.LB_CAP ends a run: the most a game can score.
            const maxed = !!fb.maxed || ui.score >= C.LB_CAP;
            const why = maxed ? `🏆 Perfect run — ${C.LB_CAP}/${C.LB_CAP}!` : timedOut ? "⏰ Time's up!" : runIsStreak(ui.game) ? "💥 Wrong answer — run over" : ui.game === "guess" ? "💀 Out of misses — run over" : "💥 Out of guesses — run over";
            const unit = fb.answer && fb.answer.name ? `<div class="run-over-unit"><img src="${esc(thumb(fb.answer.img))}" alt="" ${THUMB_FALLBACK}><span>${maxed ? "Last one:" : "It was"} <b>${esc(fb.answer.name)}</b></span></div>` : "";
            const what = `point${ui.score === 1 ? "" : "s"}${maxed ? " — the most a game can score" : ""}`;
            // What it adds to the leaderboard: the same number (double on its puzzle day).
            const counts = ui.ranked && ui.bonus && ui.score > 0
                ? `<div class="run-points">⭐ Double-points day: counts as <b>${ui.score * 2}</b> leaderboard points</div>` : "";
            // Ranked: what this game now has on the board (doubled runs included).
            const board = ui.ranked ? ` · ${C.GAME_TITLES[ui.game]} on the leaderboard: <b>${ui.pts}</b>` : "";
            const best = ui.challenge ? "" : ui.newBest
                ? `<div class="run-newbest">🏆 New best${ui.ranked ? " this week" : ""}!</div>${board ? `<div class="dim" style="margin-top:6px; font-size:0.85rem;">${board.slice(3)}</div>` : ""}`
                : `<div class="dim" style="margin-top:6px; font-size:0.9rem;">${ui.ranked ? "Your best this week" : "Your best"}: ${ui.best}${board}</div>`;
            let outcome = "";
            if (ui.challenge) {
                const d = ui.score - (ui.challenge.score || 0);
                const theirs = esc(challengeLabel(ui.challenge));
                outcome = `<div class="challenge-bar ${d > 0 ? "won" : d < 0 ? "lost" : ""}" style="margin-top:10px;">${d > 0 ? `🏆 You beat your friend (${theirs})!` : d < 0 ? `😅 Your friend wins this one (${theirs}).` : `🤝 A tie — you both got ${theirs}.`}</div>`;
            }
            const note = !ui.ranked && !ui.challenge
                ? `<p class="dim" style="font-size:0.85rem; margin:10px 0 0;">${ui.note === "signin" ? "Sign in to put your runs on the weekly leaderboard 🏆" : esc(ui.note)}</p>` : "";
            const share = ui.score > 0 && ui.seed != null ? `<button class="btn-primary" onclick="openFriends()">⚔️ Challenge a friend</button>` : "";
            return `<div class="run-over${maxed ? " maxed" : ""}">
                <div class="run-over-title">${why}</div>
                ${unit}
                <div class="run-over-score">${ui.score}</div>
                <div class="dim">${what}</div>
                ${counts}${best}${outcome}${note}
                ${ui.ranked ? `<button class="lb-link" onclick="switchTab('ranks')">🏆 See where you rank</button>` : ""}
                <div class="game-actions"><button class="${share ? "btn-ghost" : "btn-primary"}" onclick="startRun('${ui.game}', { fresh: true })">▶️ Play again</button>${share}</div>
            </div>`;
        }
        // The chat message for a finished run: the score, and a link that
        // replays the same run (its seed — safe to share once it's over).
        function runChallengeMessage() {
            const ui = runUi, icon = C.GAME_ICONS[ui.game], title = C.GAME_TITLES[ui.game];
            const brag = runIsStreak(ui.game) ? `I got a streak of ${ui.score} in ${icon} ${title}` : `I scored ${ui.score} point${ui.score === 1 ? "" : "s"} in ${icon} ${title}`;
            return `⚔️ ${brag} — can you beat me?\n${CHALLENGE_URL}${ui.game}.s${ui.seed.toString(36)}.${Math.min(999, ui.score)}`;
        }

        /* ================================================================
           🏆 WEEKLY LEADERBOARD — its own tab: the top 3 on a podium, everyone
           else in order below, your place, and how points work (folded away).
           Every game counts the same: your best run this week in each is its
           points (at most C.LB_CAP), added up — the week's ⭐ bonus game
           double. The top 5 when the week ends win tokens (paid by
           api/games.js). Names are only sent to signed-in players.
           ================================================================ */
        let lbData = null, lbLoadedAt = 0, lbLoading = false, lbError = false, lbShowAll = false;
        const LB_ORDER = ["unitle", "hilo", "trivia", "guess", "blur"];
        async function loadLeaderboard(force) {
            if (tab !== "ranks" && !force) return; // nothing to load until the tab is open
            if (lbLoading) return;
            if (!force && lbData && Date.now() - lbLoadedAt < 30000) { renderLeaderboard(); return; }
            lbLoading = true;
            try {
                const AS = await appStateReady();
                await AS.waitForAuthReady();
                if (typeof AS.gamesLeaderboard !== "function") throw new Error("unavailable");
                lbData = await AS.gamesLeaderboard();
                lbData.receivedAt = Date.now();
                lbData.signedIn = !!AS.getCurrentUser() && !lbData.signedOut;
                lbLoadedAt = Date.now();
                lbError = false;
            } catch (e) {
                lbError = true;
            } finally {
                lbLoading = false;
                renderLeaderboard();
            }
        }
        function fmtLeft(ms) {
            const m = Math.max(0, Math.floor(ms / 60000)), d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60);
            return d ? `${d}d ${h}h` : h ? `${h}h ${m % 60}m` : `${m}m`;
        }
        function renderRanks() {
            setIntro(`This week's best players. Your best run in each game counts — up to ${C.LB_CAP} points, or ${C.LB_GAME_MAX} on the day it's Today's Puzzle.`);
            $("gameArea").innerHTML = `<div class="ranks" id="lbCard"><div class="lb-empty">Loading the weekly leaderboard…</div></div>`;
            loadLeaderboard();
            renderLeaderboard();
        }
        const placeIcon = (i) => ["🥇", "🥈", "🥉"][i] || `#${i + 1}`;
        function lbRulesHtml(prizes, bonus) {
            const pay = prizes ? prizes.map((p, i) => `${placeIcon(i)} ${p}`).join(" · ") + " 🪙" : "tokens";
            return `<details class="lb-how"><summary>How points work</summary><ul>
                    <li>Your score in a game <b>is</b> your points — what you see is what counts. A run stops at <b>${C.LB_CAP}</b>, the most a game can score.</li>
                    <li>🧠 Trivia · ⬆️ Hi-Lo: 1 point per right answer. 🎯 Unitle · 🪢 Hangman · 🔍 Blur: more points for fewer guesses or misses on each unit.</li>
                    <li>⭐ Each day, the game that's <b>🎲 Today's Puzzle</b> counts <b>double</b>: a run you start that day is worth twice its score (${C.LB_CAP} = ${C.LB_GAME_MAX}).${bonus ? ` Today: ${C.GAME_ICONS[bonus]} <b>${C.GAME_TITLES[bonus]}</b>.` : ""}</li>
                    <li>Each game counts its best run of the week, doubled or not — so up to ${C.LB_GAME_MAX} each, and <b>${C.LB_MAX}</b> for the week if you hit ${C.LB_CAP} in every game on its double day (every game comes up at least once a week).</li>
                    <li>Only your best run this week in each game counts, played signed in (not friends' challenges or 🎲 Today's Puzzle).</li>
                    <li>The week ends Sunday midnight (Singapore time). The top ${prizes ? prizes.length : 5} win ${pay}, sent to your inbox.</li>
                </ul></details>`;
        }
        function lbBonusHtml(d) {
            if (!d.bonus) return "";
            return `<button type="button" class="lb-bonus" onclick="switchTab('${d.bonus}')">⭐ Double points today: ${C.GAME_ICONS[d.bonus]} ${C.GAME_TITLES[d.bonus]}
                <small>It's Today's Puzzle game — score ${C.LB_CAP} in it today for ${C.LB_GAME_MAX}. Tap to play ›</small></button>`;
        }
        function renderLeaderboard() {
            const box = $("lbCard");
            if (!box) return;
            if (!lbData) {
                box.innerHTML = lbError ? `<div class="lb-empty">The leaderboard isn't available right now — try again in a bit.</div>`
                    : `<div class="lb-empty">Loading the weekly leaderboard…</div>`;
                return;
            }
            const d = lbData;
            const left = d.endsAt - (d.now + (Date.now() - d.receivedAt));
            const head = `<div class="lb-hero"><div class="lb-hero-title">🏆 Weekly leaderboard</div><div class="lb-ends">⏳ Ends in <b>${fmtLeft(left)}</b></div></div>`;
            if (!d.signedIn) {
                box.innerHTML = `${head}${lbBonusHtml(d)}<div class="lb-signin"><p>Sign in to see who's on top this week and race for <b>${d.prizes.map(p => "+" + p).join(" / ")} 🪙</b>.</p>
                    <button class="btn-primary" onclick="signInForBoard(this)">Sign in</button></div>${lbRulesHtml(d.prizes, d.bonus)}`;
                return;
            }
            const medals = ["🥇", "🥈", "🥉"];
            const spot = (r, place) => r
                ? `<div class="pod p${place}${r.me ? " me" : ""}"><div class="pod-medal">${medals[place - 1]}</div><div class="pod-name">${esc(r.name)}${r.me ? " (you)" : ""}</div><div class="pod-score">${r.total}</div>
                    <div class="pod-block"><b>${place}</b><small>+${d.prizes[place - 1]} 🪙</small></div></div>`
                : `<div class="pod p${place} empty"><div class="pod-medal">${medals[place - 1]}</div><div class="pod-name">—</div><div class="pod-score">&nbsp;</div>
                    <div class="pod-block"><b>${place}</b><small>+${d.prizes[place - 1]} 🪙</small></div></div>`;
            const podium = `<div class="podium">${spot(d.top[1], 2)}${spot(d.top[0], 1)}${spot(d.top[2], 3)}</div>`;
            const rest = d.top.slice(3);
            const list = lbShowAll ? rest : rest.slice(0, 7);
            // 4th and 5th win too: their prize sits on their row.
            const rows = list.map(r => `<div class="lb-row${r.me ? " me" : ""}"><span class="lb-rank">#${r.rank}</span><span class="lb-name">${esc(r.name)}${r.me ? " (you)" : ""}</span>${d.prizes[r.rank - 1] ? `<span class="lb-prize-tag">+${d.prizes[r.rank - 1]} 🪙</span>` : ""}<span class="lb-total">${r.total}</span></div>`).join("");
            const more = rest.length > 7 ? `<button class="lb-more" onclick="lbShowAll = !lbShowAll; renderLeaderboard();">${lbShowAll ? "Show fewer" : `Show all ${d.top.length}`}</button>` : "";
            // Each game's points on the board this week — "×2" when they came from a
            // doubled run — and today's double game starred.
            const chips = (row) => {
                const p = row.pts || C.lbPts(row), dbl = row.dbl || {};
                return `<div class="lb-chips">${LB_ORDER.map(g => `<span class="${[g === d.bonus ? "bonus" : "", dbl[g] ? "dbl" : ""].join(" ").trim()}"
                    title="${dbl[g] ? "From a doubled run" : "From a normal run"}${g === d.bonus ? " · double points today" : ""}">${C.GAME_ICONS[g]} <b>${p[g] || 0}</b>${dbl[g] ? `<small>×2</small>` : ""}${g === d.bonus ? " ⭐" : ""}</span>`).join("")}</div>`;
            };
            // Where you stand on today's double game, so a plain 20 there doesn't look like a missing ×2.
            function bonusHint(row) {
                if (!d.bonus) return "";
                const g = d.bonus, t = `${C.GAME_ICONS[g]} ${C.GAME_TITLES[g]}`, p = (row.pts || {})[g] || 0, dbl = (row.dbl || {})[g];
                let s;
                if (dbl && p >= C.LB_GAME_MAX) s = `⭐ ${t} is maxed for the week: <b>${p}</b> from a perfect doubled run.`;
                else if (dbl) s = `⭐ Your ${p} in ${t} is from a doubled run today. A better run today raises it — ${C.LB_CAP} makes it ${C.LB_GAME_MAX}.`;
                else if (p > 0) s = `⭐ Your ${p} in ${t} was a normal run, so it didn't count double. ${t} is double today — play it now and a run of ${C.LB_CAP} makes it <b>${C.LB_GAME_MAX}</b>.`;
                else s = `⭐ ${t} counts double today — a run of ${C.LB_CAP} makes it <b>${C.LB_GAME_MAX}</b>.`;
                return `<div class="lb-hint">${s}</div>`;
            }
            const me = d.me && d.me.rank
                ? `<div class="lb-me"><div>You're <b>#${d.me.rank}</b> · <b>${d.me.total}</b> points <span class="dim">(most a week can score: ${d.max || C.LB_MAX})</span></div>${chips(d.me)}${bonusHint(d.me)}</div>`
                : `<div class="lb-me">You're not on the board yet — finish a run in any game to get on it. 🚀</div>`;
            const last = d.lastWeek && d.lastWeek.length
                ? `<div class="lb-last">Last week: ${d.lastWeek.map(w => `${placeIcon(w.rank - 1)} ${esc(w.name)}`).join(" · ")}</div>` : "";
            box.innerHTML = `${head}${lbBonusHtml(d)}${d.top.length ? podium : `<div class="lb-empty">No scores yet this week — be the first! 🚀</div>`}
                ${me}${rows ? `<div class="lb-list">${rows}</div>` : ""}${more}${last}${lbRulesHtml(d.prizes, d.bonus)}`;
        }
        async function signInForBoard(btn) {
            try { btn.disabled = true; const AS = await appStateReady(); await AS.signIn(); } catch (e) { }
            if (btn) btn.disabled = false;
            loadLeaderboard(true);
        }

        /* ---------------- start ---------------- */
        (async function init() {
            try {
                // Always opens on Today's Puzzle (not the last tab, which would
                // start a run the moment Games opens) unless a link asks for one.
                const params = new URLSearchParams(location.search);
                const asked = params.get("game");
                const valid = (t) => t === "today" || t === "ranks" || C.GAMES.includes(t);
                showTab(valid(asked) ? asked : "today");
                markBonusTab();
                // While the game data downloads, wake the games server (and its
                // sign-in check) so the first ranked move doesn't wait for it.
                signedInAppState().then(AS => AS && AS.gamesPing && AS.gamesPing()).catch(() => { });
                await loadUnits();
                clearOldDailies();
                daily = loadDailyState(dayKey());
                markTabs();
                const challenge = parseChallenge(params.get("challenge"));
                if (challenge) startChallenge(challenge);
                else render();
                // Signing in or out changes your place on the leaderboard.
                appStateReady().then(AS => AS.onAuthChange && AS.onAuthChange(() => { lbLoadedAt = 0; if (tab === "ranks") loadLeaderboard(true); })).catch(() => { });
            } catch (e) {
                $("gameArea").innerHTML = `<p class="dim" style="text-align:center;">Couldn't load the game data — check your connection and reload.</p>`;
            }
        })();
    </script>
</body>
