<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Warband</title>
    <meta name="description" content="Warband: buy troops and heroes each round, merge three of a kind into a stronger one, build team bonuses and outlast 7 rivals.">
    <link rel="icon" href="images/KIH.jpg">
    <style>
        :root { --ink: #f3efff; --dim: #b9b2dc; --panel: rgba(24, 21, 44, 0.92); --line: rgba(255, 255, 255, 0.14); --gold: #ffd24a; --red: #ff5a6a; --green: #6fe39a; --cell: 46px; --tilt: 40deg;
            --common: #b8c0d0; --rare: #5aa8ff; --epic: #b46bff; --legendary: #ffb02e; --mythic: #ff4f8b; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { margin: 0; height: 100%; background: #0d0b1a; color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; user-select: none; overscroll-behavior: none; }
        body { background: radial-gradient(ellipse at 50% 0%, #2a1f52 0%, #0d0b1a 60%); }
        button { font-family: inherit; color: inherit; touch-action: manipulation; }
        #app { max-width: max(480px, calc(var(--cell) * 7 + 32px)); margin: 0 auto; min-height: 100%; padding: calc(6px + env(safe-area-inset-top, 0px)) 8px calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 6px; }
        .top { display: flex; align-items: center; gap: 6px; }
        .icon-btn { width: 38px; height: 38px; flex-shrink: 0; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); font-size: 1rem; cursor: pointer; }
        .stats { flex: 1; display: flex; flex-wrap: wrap; gap: 4px 10px; justify-content: center; align-items: center; padding: 5px 8px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); font-weight: 800; font-size: .82rem; }
        .stats .xp { display: inline-flex; align-items: center; gap: 4px; } .stats .xp i { display: inline-block; width: 38px; height: 5px; border-radius: 3px; background: #2e2840; overflow: hidden; } .stats .xp i b { display: block; height: 100%; background: linear-gradient(90deg, #ffd24a, #fff1a8); }
        /* the 8 players */
        .players { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-bottom: 1px; }
        .players::-webkit-scrollbar { display: none; }
        .pl { flex: 0 0 auto; min-width: 54px; max-width: 70px; padding: 3px 5px; border-radius: 9px; background: var(--panel); border: 1px solid var(--line); font-size: .62rem; font-weight: 800; cursor: pointer; text-align: center; }
        .pl.me { border-color: var(--gold); }
        .pl.next { border-color: var(--red); box-shadow: 0 0 8px rgba(255, 90, 106, 0.5); }
        .pl.out { opacity: .38; }
        .pl .nm { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .pl .hp { display: block; height: 4px; margin-top: 2px; border-radius: 3px; background: #3a1620; overflow: hidden; } .pl .hp b { display: block; height: 100%; background: linear-gradient(90deg, #ff4f6a, #ff8a5a); }
        /* team bonuses */
        .traits { display: flex; flex-wrap: nowrap; gap: 4px; min-height: 26px; align-items: center; overflow-x: auto; scrollbar-width: none; padding: 3px 2px; } /* one row: 💰, 👥, then the bonuses (it scrolls if there are many) */
        .traits::-webkit-scrollbar { display: none; }
        .traits > * { flex-shrink: 0; white-space: nowrap; }
        .tr { padding: 2px 7px; border-radius: 999px; font-size: .66rem; font-weight: 800; background: rgba(255, 255, 255, 0.06); border: 1px solid var(--line); color: var(--dim); cursor: pointer; }
        .tr.on { color: #1a1430; background: linear-gradient(90deg, #ffd24a, #ffb02e); border-color: transparent; }
        .tr.on.t2 { background: linear-gradient(90deg, #d7e3ff, #9fb8ff); } .tr.on.t3 { background: linear-gradient(90deg, #ffb8f0, #b46bff); color: #fff; }
        .vs { text-align: center; font-weight: 900; font-size: .8rem; align-self: center; max-width: 100%; padding: 2px 10px; border-radius: 10px; background: rgba(13, 11, 26, 0.82); } /* (a dark backing: their back row stands up behind it) */ .vs small { display: block; color: var(--dim); font-size: .66rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        /* 🧱 the board: tilted like a table, the units stand up on it */
        /* (the tilt leaves the board's flat height empty above it: the board's pulled up into it, leaving room for the back row standing up) */
        .stage { display: flex; justify-content: center; perspective: 900px; perspective-origin: 50% -20%; margin-top: calc(var(--cell) * -1.05); margin-bottom: 2px; position: relative; z-index: 0; }
        .vs, .top, .players { position: relative; z-index: 1; }
        .board { position: relative; display: grid; grid-template-columns: repeat(7, var(--cell)); grid-template-rows: repeat(8, var(--cell)); transform: rotateX(var(--tilt)); transform-origin: 50% 100%; transform-style: preserve-3d;
            border-radius: 14px; background: linear-gradient(180deg, #3a1f36 0%, #2a2347 48%, #232a52 52%, #1d2446 100%); box-shadow: 0 22px 30px rgba(0, 0, 0, 0.55), inset 0 0 0 1px rgba(255, 255, 255, 0.08); }
        .board::after { content: ""; position: absolute; left: 4px; right: 4px; top: 50%; height: 2px; margin-top: -1px; background: rgba(255, 255, 255, 0.18); border-radius: 2px; }
        .cell { position: relative; transform-style: preserve-3d; border: 1px solid rgba(255, 255, 255, 0.05); }
        .cell.mine { background: rgba(120, 140, 255, 0.05); cursor: pointer; }
        .cell.enemy { background: rgba(255, 80, 100, 0.06); }
        .board.picking .cell.mine { background: rgba(111, 227, 154, 0.13); } /* (a unit picked: where it can go) */
        .board.picking .cell.room::before { display: none; }
        .sec { display: contents; } /* (the screen's parts: each redrawn only when it changes) */
        .cell.drop { background: rgba(111, 227, 154, 0.3); }
        /* a figure: a shadow on the board, and the unit standing on it */
        .shadow { position: absolute; left: 14%; right: 14%; bottom: 10%; height: 26%; border-radius: 50%; background: radial-gradient(ellipse, rgba(0, 0, 0, 0.55), transparent 70%); }
        .base { position: absolute; left: 10%; right: 10%; bottom: 12%; height: 30%; border-radius: 50%; border: 2px solid var(--c, var(--common)); background: radial-gradient(ellipse at 50% 35%, rgba(255, 255, 255, 0.25), rgba(0, 0, 0, 0.3)); }
        .enemy .base, .foe .base { border-style: dashed; }
        .fig { position: absolute; left: 50%; bottom: 24%; width: calc(var(--cell) - 2px); height: calc(var(--cell) - 2px); margin-left: calc((var(--cell) - 2px) / -2); transform: rotateX(calc(var(--tilt) * -1)); transform-origin: 50% 100%; transform-style: preserve-3d; }
        .u { position: relative; width: 100%; height: 100%; border-radius: 10px; border: 2px solid var(--c, var(--common)); background: #241f40; overflow: hidden; cursor: pointer; touch-action: none; box-shadow: 0 3px 6px rgba(0, 0, 0, 0.5); }
        .u img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
        .u .st { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; font-size: .55rem; line-height: 1; padding: 1px 0; color: #ffe27a; background: rgba(0, 0, 0, 0.55); letter-spacing: -1px; }
        .u.sel { box-shadow: 0 0 0 2px #fff, 0 0 14px var(--c); }
        .u.s2 { box-shadow: 0 0 8px rgba(215, 227, 255, 0.7), 0 3px 6px rgba(0, 0, 0, 0.5); } .u.s3 { box-shadow: 0 0 12px rgba(255, 184, 240, 0.9), 0 3px 6px rgba(0, 0, 0, 0.5); }
        .u.ghost { position: fixed; z-index: 50; pointer-events: none; opacity: .9; transform: scale(1.12); width: 40px; height: 40px; }
        .u.dragging { opacity: .3; }
        .cdb { position: absolute; right: -6px; top: -7px; min-width: 18px; height: 16px; padding: 0 3px; border-radius: 8px; background: #1a1430; border: 1px solid #8fd8ff; color: #8fd8ff; font-size: .56rem; font-weight: 900; line-height: 14px; text-align: center; z-index: 4; }
        .cdb.ready { background: #ffd24a; color: #1a1430; border-color: #fff1a8; }
        .tal { position: absolute; left: -5px; top: -7px; font-size: .62rem; z-index: 4; }
        /* 💰 your gold: big and gold, where you buy — it pulses, and −3 / +2 floats up, when it changes */
        .gold-pill { display: inline-flex; align-items: center; gap: 3px; padding: 2px 10px; border-radius: 999px; background: linear-gradient(180deg, #ffe27a, #ffb02e); color: #2a1200; font-weight: 900; font-size: .98rem; box-shadow: 0 0 10px rgba(255, 190, 60, 0.55); position: relative; }
        .money { display: inline-flex; align-items: baseline; gap: 5px; padding: 3px 10px; border-radius: 999px; background: linear-gradient(180deg, #ffe27a, #ffb02e); color: #2a1200; font-weight: 900; font-size: .86rem; box-shadow: 0 0 10px rgba(255, 190, 60, 0.5); position: relative; }
        .money small { font-size: .64rem; font-weight: 800; opacity: .8; }
        .bump { animation: bump .45s ease-out; } @keyframes bump { 30% { transform: scale(1.22); } }
        .gdelta { position: absolute; right: -4px; top: -6px; font-size: .8rem; font-weight: 900; pointer-events: none; text-shadow: 0 1px 2px #000; animation: rise .9s ease-out forwards; z-index: 9; }
        .gdelta.up { color: #8cff9c; } .gdelta.down { color: #ff8a8a; }
        .slots { padding: 2px 8px; border-radius: 999px; font-size: .7rem; font-weight: 900; background: rgba(111, 227, 154, 0.16); border: 1px solid rgba(111, 227, 154, 0.55); color: #8cff9c; }
        .slots.full { background: rgba(255, 210, 74, 0.16); border-color: rgba(255, 210, 74, 0.55); color: #ffe27a; }
        .cell.room::before { content: "+"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: rgba(140, 255, 156, 0.35); font-weight: 900; font-size: 1rem; }
        /* ✕ delete: only while the mouse is over one of your units (a computer) — in its own top corner, so it never
           covers another; on a phone (no hovering) it's 🗑️ Delete in a tapped unit's card, or drag it onto the shop */
        .del { display: none; position: absolute; left: -6px; top: -7px; width: 20px; height: 20px; padding: 0; border-radius: 50%; border: 2px solid #fff; background: #e0304a; color: #fff; font-size: .62rem; font-weight: 900; line-height: 1; cursor: pointer; z-index: 8; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5); }
        @media (hover: hover) and (pointer: fine) {
            .cell.mine:hover .del, .slot:hover .del { display: block; }
            .cell.mine:hover .tal { display: none; }
        }
        .del:hover, .del:focus-visible { background: #ff4058; transform: scale(1.12); }
        .del:hover::after, .del:focus-visible::after { content: attr(data-tip); position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translateX(-50%); padding: 4px 8px; border-radius: 8px; background: #1a1430; border: 1px solid #ff8a8a; color: #ffd6d6; font-size: .7rem; white-space: nowrap; pointer-events: none; }
        .sell-zone { position: relative; }
        .sell-zone::after { content: "🗑️ Drop to delete · " attr(data-sell) " back"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: rgba(224, 48, 74, 0.82); color: #fff; font-weight: 900; font-size: .95rem; z-index: 5; pointer-events: none; }
        /* in a fight */
        .fu { position: absolute; width: var(--cell); height: var(--cell); transition: left .16s linear, top .16s linear; transform-style: preserve-3d; z-index: 2; }
        .fu.leaping { transition: left .3s ease-out, top .3s ease-out; } .fu.leaping .fig { animation: arc .3s ease-out; }
        @keyframes arc { 50% { translate: 0 -26px; } }
        .fu .bar { position: absolute; left: 3px; right: 3px; top: -8px; height: 4px; border-radius: 3px; background: rgba(0, 0, 0, 0.65); overflow: hidden; z-index: 3; }
        .fu .bar b { display: block; height: 100%; background: #6fe39a; transition: width .12s; } .fu.foe .bar b { background: #ff5a6a; }
        .fu .bar i { position: absolute; left: 0; top: 0; height: 100%; background: rgba(160, 200, 255, 0.85); }
        .fu.dead { opacity: 0; transition: opacity .45s, left .16s, top .16s; } .fu.dead .fig { transform: rotateX(calc(var(--tilt) * -1)) translateY(10px) scale(.7); transition: transform .45s; }
        .fu .fig.lunge { animation: lunge .22s ease-out; } @keyframes lunge { 40% { translate: 0 -7px; scale: 1.12; } }
        .fu .fig.hurt .u { filter: brightness(1.9) saturate(.2); }
        .fu .fig.cast .u { box-shadow: 0 0 16px 6px #fff1a8; }
        .fu.shielded .u { outline: 3px solid rgba(110, 190, 255, 0.85); outline-offset: 1px; }
        .fu.rallied .u { box-shadow: 0 0 12px 3px #ff9f43; }
        .fu.summoned .fig { scale: .78; } .fu.summoned .u { filter: hue-rotate(250deg) saturate(.6) brightness(1.1); opacity: .85; }
        .fu .mark { position: absolute; left: 50%; top: -24px; transform: translateX(-50%); font-size: .85rem; z-index: 5; animation: bob .8s ease-in-out infinite; }
        @keyframes bob { 50% { translate: 0 -3px; } }
        .label { position: absolute; left: 50%; top: -30px; transform: translateX(-50%); white-space: nowrap; padding: 2px 7px; border-radius: 8px; background: rgba(20, 16, 40, 0.9); border: 1px solid #ffd24a; color: #ffe27a; font-size: .6rem; font-weight: 900; z-index: 6; pointer-events: none; animation: pop 1.1s ease-out forwards; }
        .label.talent { border-color: #ffb8f0; color: #ffd6f4; }
        @keyframes pop { 0% { opacity: 0; translate: 0 6px; } 15% { opacity: 1; translate: 0 0; } 80% { opacity: 1; } 100% { opacity: 0; translate: 0 -10px; } }
        .num { position: absolute; font-size: .72rem; font-weight: 900; color: #fff; text-shadow: 0 1px 2px #000, 0 0 4px #000; pointer-events: none; z-index: 7; animation: rise .7s ease-out forwards; }
        .num.big { color: #ffe27a; font-size: .86rem; } .num.heal { color: #8cff9c; } .num.miss { color: #c9d4ff; font-size: .62rem; }
        @keyframes rise { to { transform: translateY(-22px); opacity: 0; } }
        .shot { position: absolute; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: radial-gradient(circle, #fff, #ffd24a 55%, transparent 70%); box-shadow: 0 0 8px #ffd24a; z-index: 6; pointer-events: none; transition: left .18s linear, top .18s linear; transform: translateZ(22px); }
        .shot.magic { background: radial-gradient(circle, #fff, #b46bff 55%, transparent 70%); box-shadow: 0 0 10px #b46bff; width: 12px; height: 12px; margin: -6px 0 0 -6px; }
        .ring { position: absolute; width: calc(var(--cell) * 3); height: calc(var(--cell) * 3); margin: calc(var(--cell) * -1.5) 0 0 calc(var(--cell) * -1.5); border-radius: 50%; border: 3px solid #ff9f43; background: radial-gradient(circle, rgba(255, 160, 60, 0.35), transparent 65%); pointer-events: none; z-index: 1; animation: boom .5s ease-out forwards; }
        .ring.heal { border-color: #6fe39a; background: radial-gradient(circle, rgba(111, 227, 154, 0.35), transparent 65%); }
        .ring.cold { border-color: #8fd8ff; background: radial-gradient(circle, rgba(143, 216, 255, 0.35), transparent 65%); }
        .ring.dark { border-color: #b46bff; background: radial-gradient(circle, rgba(180, 107, 255, 0.35), transparent 65%); }
        @keyframes boom { from { transform: scale(.25); opacity: 1; } to { transform: scale(1); opacity: 0; } }
        .puff { position: absolute; width: var(--cell); height: var(--cell); margin: calc(var(--cell) / -2) 0 0 calc(var(--cell) / -2); border-radius: 50%; background: radial-gradient(circle, rgba(200, 160, 255, 0.8), transparent 65%); animation: boom .5s ease-out forwards; pointer-events: none; z-index: 1; }
        /* bench, info, shop */
        .bench { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 3px; padding: 4px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
        .slot { aspect-ratio: 1; border-radius: 8px; background: rgba(255, 255, 255, 0.04); border: 1px dashed rgba(255, 255, 255, 0.1); display: flex; align-items: center; justify-content: center; position: relative; }
        .slot .u { width: 100%; height: 100%; }
        .slot.drop { border: 2px solid var(--green); }
        .info { min-height: 40px; padding: 5px 9px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); font-size: .72rem; color: var(--dim); display: flex; align-items: center; gap: 8px; }
        .info b { color: var(--ink); }
        .info .grow { flex: 1; min-width: 0; }
        .sell-btn { padding: 7px 10px; border-radius: 10px; border: 1px solid rgba(255, 90, 106, 0.5); background: rgba(255, 90, 106, 0.15); font-weight: 900; font-size: .78rem; cursor: pointer; white-space: nowrap; }
        .shop { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; } /* (minmax: a long name never widens a card) */
        .card { min-width: 0; position: relative; padding: 4px 3px 5px; border-radius: 11px; border: 2px solid var(--c, var(--common)); background: linear-gradient(180deg, rgba(255, 255, 255, 0.07), rgba(0, 0, 0, 0.2)); cursor: pointer; text-align: center; min-height: 92px; }
        .card img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 7px; display: block; }
        .card .nm { display: block; font-size: .58rem; font-weight: 800; line-height: 1.1; margin-top: 2px; height: 1.3em; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .card .co { position: absolute; top: 2px; right: 2px; padding: 0 4px; border-radius: 7px; background: rgba(0, 0, 0, 0.7); font-size: .62rem; font-weight: 900; color: var(--gold); }
        .card .fa { position: absolute; top: 2px; left: 2px; font-size: .7rem; text-shadow: 0 1px 2px #000; }
        .card.have { box-shadow: 0 0 0 2px #fff1a8, 0 0 10px #ffd24a; }
        .card.poor { opacity: .45; }
        .card.empty { border-style: dashed; border-color: var(--line); cursor: default; background: none; }
        .acts { display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.3fr); gap: 6px; }
        .acts .lock { padding: 11px 10px; font-size: 1rem; }
        .acts .lock.on { background: rgba(255, 210, 74, 0.2); border-color: #ffd24a; box-shadow: 0 0 10px rgba(255, 210, 74, 0.45); }
        .shop.locked { outline: 2px dashed rgba(255, 210, 74, 0.8); outline-offset: 3px; border-radius: 12px; }
        .acts button, .big { padding: 11px 8px; border-radius: 13px; border: 1px solid var(--line); background: var(--panel); font-weight: 900; font-size: .86rem; cursor: pointer; }
        .acts button { padding: 7px 6px; font-size: .82rem; line-height: 1.15; } .acts button small { display: block; font-size: .7rem; color: #ffe27a; font-weight: 800; }
        .acts button:disabled { opacity: .45; cursor: default; }
        .acts .go, .big.main { background: linear-gradient(180deg, #ff7a5a, #c8304a); border-color: transparent; color: #fff; }
        .sell-zone { outline: 2px dashed var(--red); outline-offset: 2px; border-radius: 12px; }
        /* screens and sheets */
        .screen { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 10px; text-align: center; padding: 10px 4px; }
        .screen h1 { margin: 0; font-size: 1.6rem; }
        .screen p { margin: 0; color: var(--dim); font-size: .88rem; line-height: 1.45; }
        .screen ul { text-align: left; margin: 0; padding-left: 20px; color: var(--dim); font-size: .84rem; line-height: 1.5; }
        .place { font-size: 3.2rem; font-weight: 900; color: var(--gold); line-height: 1; }
        .won { padding: 12px 14px; border-radius: 16px; background: linear-gradient(180deg, rgba(255, 226, 122, 0.22), rgba(255, 176, 46, 0.12)); border: 2px solid #ffd24a; font-weight: 900; font-size: 1.05rem; color: #ffe27a; animation: bump .6s ease-out; }
        .won small { display: block; margin-top: 3px; font-size: .74rem; color: var(--dim); font-weight: 700; }
        .won.none { border-color: var(--line); background: var(--panel); color: var(--dim); font-size: .9rem; animation: none; }
        .rw { padding: 8px 10px; border-radius: 12px; background: rgba(255, 210, 74, 0.1); border: 1px solid rgba(255, 210, 74, 0.4); }
        .sheet-bg { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
        .sheet-bg[hidden] { display: none; }
        .sheet { width: 100%; max-width: 480px; max-height: 82vh; overflow-y: auto; padding: 16px 14px calc(16px + env(safe-area-inset-bottom, 0px)); border-radius: 20px 20px 0 0; background: #1c1836; border-top: 1px solid var(--line); }
        .sheet h2 { margin: 0 0 8px; font-size: 1.1rem; }
        .sheet p, .sheet li { color: var(--dim); font-size: .84rem; line-height: 1.45; }
        .sheet .mini { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
        .sheet .mini .u { width: 40px; height: 40px; }
        .toast { position: fixed; left: 50%; top: 22%; transform: translate(-50%, -50%); padding: 9px 16px; border-radius: 14px; background: #2a2450; border: 1px solid var(--line); font-weight: 900; text-align: center; z-index: 80; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 86vw; font-size: .88rem; }
        .toast.on { opacity: 1; }
        .banner { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); padding: 12px 20px; border-radius: 16px; background: rgba(20, 16, 40, 0.94); border: 1px solid var(--line); font-weight: 900; font-size: 1.15rem; text-align: center; z-index: 30; white-space: nowrap; }
        .banner small { display: block; font-size: .76rem; color: var(--dim); margin-top: 3px; }
        .win { color: var(--green); } .lose { color: var(--red); }
        /* a short screen (under 720 px tall): everything but the board slimmer, so the board can stay a good size */
        body.compact #app { gap: 4px; padding-top: calc(4px + env(safe-area-inset-top, 0px)); padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); }
        body.compact .icon-btn { width: 32px; height: 32px; } body.compact .stats { padding: 3px 6px; font-size: .76rem; } body.compact .gold-pill { font-size: .88rem; padding: 1px 8px; }
        body.compact .pl { padding: 2px 4px; font-size: .56rem; } body.compact .pl .hp { height: 3px; }
        body.compact .vs { font-size: .72rem; } body.compact .vs small { display: none; }
        body.compact .traits { min-height: 22px; padding: 1px 2px; } body.compact .money { font-size: .76rem; padding: 2px 8px; } body.compact .slots, body.compact .tr { font-size: .6rem; }
        body.compact .bench { padding: 3px; gap: 2px; }
        body.compact .info { min-height: 0; padding: 4px 8px; font-size: .66rem; } body.compact .info .grow { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        body.compact .card { min-height: 0; padding: 3px 2px 3px; } body.compact .card img { aspect-ratio: 4 / 3; } body.compact .card .nm { font-size: .54rem; }
        body.compact .acts button { padding: 5px 4px; font-size: .76rem; } body.compact .acts .lock { padding: 5px 8px; }
        @media (max-width: 370px) { :root { --cell: 42px; } }
        @media (max-width: 330px) { :root { --cell: 39px; } }

</head>
<body>
<div id="app"><div class="screen"><p>Loading Warband…</p></div></div>
<div class="sheet-bg" id="sheetBg" hidden><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script src="warband-core.js"></script>
<script type="module" src="appState.js"></script>
<script>
(function () {
    "use strict";
    const W = window.WarbandCore;
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const inApp = (() => { try { return window.parent !== window && typeof window.parent.closeKeepHome === "function"; } catch (e) { return false; } })();
    const ORD = (n) => n + (n % 10 === 1 && n % 100 !== 11 ? "st" : n % 10 === 2 && n % 100 !== 12 ? "nd" : n % 10 === 3 && n % 100 !== 13 ? "rd" : "th");
    const FACTION_ICON = { Human: "🛡️", Undead: "💀", Mage: "🔮", Demon: "😈", Elevate: "🌟" };
    const TICK_MS = 33; // a fight plays at three times its speed

    // the match: the server's copy is the real one; this one plans the round with the same rules
    let A = null, cat = null, runId = null, match = null, moves = [], sel = null, mode = "loading", busy = false, fightTimer = null, skipFight = null, shownGold = null;
    let rewardsLeft = null, lastReward = undefined; // 🎁 today's rewarded matches left; what the last match paid (null: none — the day's were used)
    const me = () => match.players[0];
    const opp = () => (match && W.opponentOf(match, 0)) || null;

    /* 🧪 Practice on this computer only (localhost, ?local): the match is played here, in the page, with the
       same rules — nothing's saved, nothing's sent anywhere. (For trying Warband before its server code is live.) */
    const LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && new URLSearchParams(location.search).has("local");
    async function localServer() {
        await new Promise((ok, no) => { const s = document.createElement("script"); s.src = "games-core.js"; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
        const G = window.GamesCore, files = {};
        await Promise.all(G.ALL_DATA_FILES.map(f => fetch(f).then(r => r.json()).then(j => { files[f] = j; })));
        const units = G.unitsFromFiles(f => files[f]), localCat = W.catalog(units);
        let st = null, id = null;
        const key = (r) => "local-" + id + "-" + r;
        const view = (extra) => ({ ok: true, runId: id, match: W.forPlayer(st), cat: localCat, ...(extra || {}) });
        const fail = (status, msg) => { const e = new Error(msg); e.status = status; return e; };
        return {
            warbandGet: async () => (st && !st.over ? view() : { ok: true, runId: null, match: null }),
            warbandStart: async () => { id = Math.random().toString(16).slice(2, 14); st = W.newMatch(localCat, id, { name: "You", skill: 0.3, roundKey: key }); return view(); },
            warbandRound: async (runId, round, actions) => {
                if (!st || runId !== id) throw fail(404, "That match doesn't exist.");
                if (round !== st.round) throw fail(409, "That round's been played already.");
                const copy = JSON.parse(JSON.stringify(st));
                actions.forEach((a, i) => { try { W.planAction(localCat, copy, 0, a); } catch (e) { throw fail(400, `Move ${i + 1}: ${e.message}`); } });
                st = copy;
                const res = W.endRound(localCat, st, key);
                return view({ results: res.results, over: st.over, place: st.over ? st.players[0].place : null });
            }
        };
    }

    /* ---------------- talking to the server ---------------- */
    async function loadAppState() {
        if (LOCAL) { A = await localServer(); return { uid: "local" }; }
        for (let i = 0; i < 60 && !window.AppState; i++) await new Promise(r => setTimeout(r, 100));
        A = window.AppState || null;
        if (A && A.waitForAuthReady) await A.waitForAuthReady();
        return A && A.getCurrentUser && A.getCurrentUser();
    }
    function take(r) { if (r.cat) cat = r.cat; runId = r.runId; match = r.match; moves = []; sel = null; if (typeof r.rewardsLeft === "number") rewardsLeft = r.rewardsLeft; if (r.over) lastReward = r.reward || null; }
    async function boot() {
        let who = null;
        try { who = await loadAppState(); } catch (e) { }
        if (!who) { mode = "signin"; return render(); }
        try {
            const r = await A.warbandGet();
            if (typeof r.rewardsLeft === "number") rewardsLeft = r.rewardsLeft;
            if (r.match) { take(r); mode = "plan"; } else { mode = "start"; }
        } catch (e) { mode = "error"; render(e.message); return; }
        render();
    }
    async function startMatch(fresh) {
        if (busy) return; busy = true; render();
        try { take(await A.warbandStart(!!fresh)); mode = "plan"; }
        catch (e) { toast(e.message); }
        busy = false; render();
    }

    /* ---------------- planning ---------------- */
    function act(a) {
        if (mode !== "plan" || busy) return false;
        const before = W.units(me()).filter(u => u.s >= 2).length;
        try { W.planAction(cat, match, 0, a); }
        catch (e) { toast(e.message); return false; }
        moves.push(a);
        sel = null;
        const after = W.units(me()).filter(u => u.s >= 2).length;
        if (a.t === "buy" && after > before) toast("✨ Three of a kind — merged!");
        render();
        return true;
    }
    // Your fight, worked out here straight away — the same rules, boards and seed the server uses — so it
    // starts the moment you tap ⚔️ Fight!, while the server plays the round (its answer is the one that counts).
    function myFightNow() {
        const n = (match.pairs || []).findIndex(p => p[0] === 0 || p[1] === 0);
        if (n < 0) return null;
        const [a, b, ghost] = match.pairs[n], A2 = match.players[a].board.map(u => ({ ...u })), B2 = match.players[b].board.map(u => ({ ...u }));
        const seed = `${match.rk}:f${n}`, f = W.fight(cat, A2, B2, seed);
        const dmgA = f.winner !== 0 ? W.lossDamage(match.round, f.survivors[1]) : 0, dmgB = f.winner !== 1 && !ghost ? W.lossDamage(match.round, f.survivors[0]) : 0;
        return { a, b, ghost, seed, winner: f.winner, dmg: [dmgA, ghost ? 0 : dmgB], boards: [A2, B2] };
    }
    async function fightNow() {
        if (mode !== "plan" || busy) return;
        busy = true;
        const round = match.round, mine = moves.slice(), before = match;
        const sent = A.warbandRound(runId, round, mine).then(r => ({ r }), e => ({ e }));
        const guess = myFightNow();
        const finish = async (shown) => {
            const { r, e } = await sent;
            busy = false;
            if (e) {
                if (e.status === 400 || e.status === 409) { // (out of step: start the round again from the server's copy)
                    toast(/updated/.test(e.message || "") ? e.message : "That round didn't go through — here it is again.");
                    mode = "plan"; // (back to planning — the fight shown didn't count)
                    try { const g = await A.warbandGet(); if (g.match) take(g); else mode = "start"; } catch (e2) { }
                } else { toast(e.message || "Couldn't reach the server — try again."); mode = "plan"; }
                return render();
            }
            const res = r.results.find(x => x.a === 0 || x.b === 0);
            // (what was shown differs from the server's? its fight is played instead — it never should)
            if (shown && res && (res.seed !== shown.seed || res.winner !== shown.winner)) return playFight(before, res, () => { take(r); mode = r.over ? "over" : "plan"; render(); });
            take(r); mode = r.over ? "over" : "plan"; render();
        };
        if (guess) return playFight(before, guess, () => finish(guess));
        render();
        const { r } = await sent;
        if (!r) return finish(null);
        busy = false;
        playFight(before, r.results.find(x => x.a === 0 || x.b === 0), () => finish(null));
    }

    /* ---------------- drawing ---------------- */
    const img = (k) => `images/thumbs/${esc(k.toUpperCase())}.jpg`;
    const unitHtml = (u, extra) => { const c = cat[u.k]; return `<div class="u s${u.s}${extra || ""}" style="--c:var(--${c.rarity})" data-k="${esc(u.k)}"><img src="${img(u.k)}" alt="${esc(c.name)}" loading="lazy"><span class="st">${"★".repeat(Math.max(1, u.s))}</span></div>`; };
    // a unit standing on the board: its shadow, its base, and it (with its ⏱ ability countdown and ⭐ talent)
    // ✕ delete, with what you get back on it (and on hover: "Delete — +3 💰 back")
    const delHtml = (u, from, i) => { const v = W.sellValue(cat, u); return `<button type="button" class="del" data-del="${from}:${i}" data-tip="Delete — +${v} 💰 back" aria-label="Delete this unit: +${v} gold back">✕</button>`; };
    // its badge: its ability's icon and the seconds till it goes off (☄️5 — Meteor Strike in 5 s)
    const abIcon = (k) => (W.ABILITIES[cat[k].ability.kind] || {}).icon || "⏱";
    const figHtml = (u, extra, cd, del) => { const c = cat[u.k]; return `<span class="shadow"></span><span class="base" style="--c:var(--${c.rarity})"></span><div class="fig">${unitHtml(u, extra)}${cd == null ? "" : `<span class="cdb" title="${esc(c.ability.name)} in ${cd} s">${abIcon(u.k)}${cd}</span>`}${c.talent ? `<span class="tal" title="${esc(c.talent.name)}">⭐</span>` : ""}${del ? delHtml(u, del[0], del[1]) : ""}</div>`; };
    function topHtml() {
        const p = me(), need = W.XP_TO_NEXT[p.level];
        return `<div class="top"><button class="icon-btn" data-do="back" aria-label="Back">←</button>
            <div class="stats"><span>Round ${match.round}</span><span>❤️ ${Math.max(0, p.hp)}</span><span class="gold-pill" id="goldTop" title="Your gold — for buying, refreshing and XP">💰 ${p.gold}</span>
            <span class="xp">Lv ${p.level}${need ? `<i><b style="width:${Math.round(100 * p.xp / need)}%"></b></i>` : " (top)"}</span></div>
            <button class="icon-btn" data-do="help" aria-label="How to play">?</button></div>`;
    }
    function playersHtml() {
        const o = opp();
        const list = match.players.slice().sort((a, b) => (b.alive - a.alive) || (a.alive ? b.hp - a.hp : a.place - b.place) || a.id - b.id);
        return `<div class="players">${list.map(p => `<button class="pl${p.id === 0 ? " me" : ""}${o && o.vs === p.id && mode === "plan" ? " next" : ""}${p.alive ? "" : " out"}" data-pl="${p.id}"><span class="nm">${p.id === 0 ? "You" : esc(p.name)}</span><span class="hp"><b style="width:${Math.max(0, p.hp)}%"></b></span>${p.alive ? Math.max(0, p.hp) : ORD(p.place)}</button>`).join("")}</div>`;
    }
    // 💰 your gold, and what the next round pays (6, +1 for every 10 you've kept, up to 5 — a streak adds more)
    const moneyHtml = () => { const p = me(), next = W.ECON.base + W.interest(p.gold); return `<span class="money" id="money" title="Your gold — for buying, refreshing and XP. Next round: +${next}${W.interest(p.gold) ? ` (+${W.interest(p.gold)} for saving)` : ""}">💰 ${p.gold} <small>+${next} next round</small></span>`; };
    // 👥 on the board, of how many you can field (your level)
    const slotsHtml = () => { const p = me(), n = p.board.length; return `<span class="slots${n >= p.level ? " full" : ""}" id="slots" title="Units on the board, of how many you can field">👥 ${n}/${p.level}${n >= p.level ? (p.level < W.MAX_LEVEL ? " · ⬆️ XP for more" : "") : ` · ${p.level - n} more`}</span>`; };
    function traitsHtml(board) {
        const t = W.traitsOf(board.map(u => cat[u.k]));
        const keys = Object.keys(t).sort((a, b) => t[b].tier - t[a].tier || t[b].n - t[a].n);
        if (!keys.length) return `<div class="traits">${moneyHtml()}${slotsHtml()}<span class="tr">Team bonuses: 2 of a faction…</span></div>`;
        return `<div class="traits">${moneyHtml()}${slotsHtml()}${keys.map(k => { const x = t[k], T = W.TRAITS[k]; return `<button class="tr${x.tier ? " on t" + x.tier : ""}" data-trait="${k}">${T.icon} ${T.name} ${x.n}${x.next ? "/" + x.next : ""}</button>`; }).join("")}</div>`;
    }
    const traitsLine = (board) => { const t = W.traitsOf(board.map(u => cat[u.k])); return Object.keys(t).filter(k => t[k].tier).map(k => `${W.TRAITS[k].icon} ${W.TRAITS[k].name}`).join(" · ") || "No team bonuses"; };
    // who you'll fight, and their board (as they'll stand facing you)
    function vsHtml() {
        const o = opp();
        if (!o) return "";
        const P = match.players[o.vs];
        return `<div class="vs">Next: ⚔️ ${esc(P.name)}${o.ghost ? " (a copy)" : ""} · ❤️ ${Math.max(0, P.hp)}<small>Their team's on top — ${esc(traitsLine(P.board))}. Set yours to beat it.</small></div>`;
    }
    function boardHtml() {
        const p = me(), o = opp(), foe = o ? match.players[o.vs].board : [];
        let cells = "";
        // the top half: theirs, mirrored (their front row meets yours in the middle)
        for (let row = 0; row < 4; row++) for (let col = 0; col < W.COLS; col++) {
            const ex = W.COLS - 1 - col, ey = 3 - row, i = foe.findIndex(u => u.x === ex && u.y === ey);
            const isSel = sel && sel.from === "enemy" && sel.i === i;
            cells += `<div class="cell enemy" data-ex="${ex}" data-ey="${ey}">${i >= 0 ? figHtml(foe[i], isSel ? " sel" : "", cat[foe[i].k].ability.cd) : ""}</div>`;
        }
        // the bottom half: yours (your front row on top)
        for (let y = 0; y < W.ROWS; y++) for (let x = 0; x < W.COLS; x++) {
            const i = p.board.findIndex(u => u.x === x && u.y === y);
            const isSel = sel && sel.from === "board" && sel.i === i;
            const room = i < 0 && p.board.length < p.level && W.units(p).length > p.board.length && y === 0; // (room for more: a hint on the front row)
            cells += `<div class="cell mine${room ? " room" : ""}" data-x="${x}" data-y="${y}">${i >= 0 ? figHtml(p.board[i], isSel ? " sel" : "", cat[p.board[i].k].ability.cd, ["board", i]) : ""}</div>`;
        }
        return `<div class="stage"><div class="board plan" id="board">${cells}</div></div>`;
    }
    function benchHtml() {
        return `<div class="bench" id="bench">${me().bench.map((u, i) => { const on = sel && sel.from === "bench" && sel.i === i; return `<div class="slot" data-slot="${i}">${u ? unitHtml(u, on ? " sel" : "") + delHtml(u, "bench", i) : ""}</div>`; }).join("")}</div>`;
    }
    function unitInfo(u, mine) {
        const c = cat[u.k], m = W.STAR_MULT[u.s], ab = c.ability, A2 = W.ABILITIES[ab.kind];
        return `<div class="grow"><b>${esc(c.name)} ${"★".repeat(u.s)}</b>${mine ? "" : " · theirs"} · ${FACTION_ICON[c.faction] || ""} ${esc(c.faction)} · ${c.attack === "Ranged" ? "🏹 Ranged" : "⚔️ Melee"} · ❤️ ${Math.round(c.hp * m)} ⚔️ ${Math.round(c.atk * m)}
            <br>${A2.icon} <b>${esc(ab.name)}</b> (every ${ab.cd} s): ${esc(A2.desc)}${c.talent ? `<br>⭐ <b>${esc(c.talent.name)}</b>: ${esc(W.TALENTS[c.talent.kind](c.talent.val))}` : ""}</div>`;
    }
    function infoHtml() {
        const p = me();
        if (sel) {
            if (sel.from === "enemy") { const o = opp(), u = o && match.players[o.vs].board[sel.i]; if (u) return `<div class="info">${unitInfo(u, false)}</div>`; }
            const u = (sel.from === "board" ? p.board : p.bench)[sel.i];
            if (u) return `<div class="info">${unitInfo(u, true)}<button class="sell-btn" data-do="sell">🗑️ Delete<br><small>+${W.sellValue(cat, u)} 💰 back</small></button></div>`;
        }
        const room = p.level - p.board.length;
        return `<div class="info"><div class="grow">${room > 0 && W.units(p).length > p.board.length ? `<b>You can field ${room} more</b> — tap one on your bench, then a square.` : p.board.length ? "☄️5 over a unit: its ability in 5 s. Tap a unit to move it or ✕ delete it." : "<b>Buy units below</b>, put them on your half. ☄️5 over a unit: its ability in 5 s."}</div></div>`;
    }
    function shopHtml() {
        const p = me(), have = new Set(W.units(p).map(u => u.k));
        return `<div class="shop${p.locked ? " locked" : ""}" id="shop">${p.shop.map((k, i) => {
            if (!k) return `<div class="card empty"></div>`;
            const c = cat[k];
            return `<button class="card${have.has(k) ? " have" : ""}${p.gold < c.cost ? " poor" : ""}" style="--c:var(--${c.rarity})" data-shop="${i}"><img src="${img(k)}" alt="" loading="lazy"><span class="co">${c.cost}💰</span><span class="fa">${FACTION_ICON[c.faction] || ""}${c.attack === "Ranged" ? "🏹" : ""}</span><span class="nm">${esc(c.name)}</span></button>`;
        }).join("")}</div>
        <div class="acts"><button class="lock${p.locked ? " on" : ""}" data-do="lock" aria-pressed="${p.locked}" aria-label="${p.locked ? "Unlock the shop" : "Lock the shop: keep it for the next round"}" title="${p.locked ? "Locked: this shop stays for the next round" : "Lock: keep this shop for the next round"}">${p.locked ? "🔒" : "🔓"}</button><button data-do="reroll"${p.gold < W.ECON.reroll ? " disabled" : ""}>🔄 Refresh<small>2 💰</small></button><button data-do="xp"${p.gold < W.ECON.xpCost || p.level >= W.MAX_LEVEL ? " disabled" : ""}>⬆️ XP<small>4 💰</small></button><button class="go" data-do="fight"${busy ? " disabled" : ""}>${busy ? "…" : "⚔️ Fight!"}</button></div>`;
    }
    const PLAN_PARTS = ["top", "players", "vs", "board", "traits", "bench", "info", "shop"];
    let partWas = {};
    function render(err) {
        const app = $("app");
        if (mode !== "plan") app.dataset.layout = mode;
        if (mode === "loading") { app.innerHTML = `<div class="screen"><p>Loading Warband…</p></div>`; return; }
        if (mode === "error") { app.innerHTML = `<div class="screen"><h1>⚔️ Warband</h1><p>Couldn't load your match: ${esc(err || "")}</p><button class="big main" data-do="retry">Try again</button><button class="big" data-do="back">← Back</button></div>`; return; }
        if (mode === "signin") { app.innerHTML = `<div class="screen"><h1>⚔️ Warband</h1><p>Sign in to play — every match is played on our server, so nobody can fake a win.</p><button class="big" data-do="back">← Back</button></div>`; return; }
        if (mode === "start") {
            app.innerHTML = `<div class="screen">${LOCAL ? `<p style="color:#ffb8f0">🧪 Practice on this computer — nothing's saved.</p>` : ""}<h1>⚔️ Warband</h1><p>You and 7 rivals, 100 ❤️ each. Last one standing wins — about 10 rounds.</p>
                <ul><li>💰 Each round you get gold: buy troops and heroes from the shop.</li><li>✨ Three of the same merge into a ★2 — three ★2s into a ★3.</li>
                <li>👀 You see who you'll fight next, and their team — set yours to beat it.</li>
                <li>☄️5 over a unit: its own ability (Meteor Strike, Snowball, Healing Veil…) goes off in 5 s; heroes have their ⭐ talents too.</li>
                <li>🛡️ Same faction (Human, Undead, Mage…) or attack type: team bonuses.</li>
                <li>⚔️ Then your team fights theirs — lose and you lose ❤️.</li></ul>
                ${LOCAL ? `<p>🧪 Practice pays no rewards.</p>` : `<p class="rw">🎁 <b>Rewards</b> for where you finish — 🥇 🪙 2 · ✨ 250 · 🧰 a chest draw … — ${rewardsLeft == null ? `for your first ${W.DAILY_REWARDS} matches a day` : rewardsLeft > 0 ? `<b>${rewardsLeft} of ${W.DAILY_REWARDS} left today</b>` : `today's ${W.DAILY_REWARDS} are used — more tomorrow (you can still play)`}.</p>`}
                <p>🏆 Ranks are coming soon.</p>
                <button class="big main" data-do="start"${busy ? " disabled" : ""}>${busy ? "Starting…" : "⚔️ Play"}</button><button class="big" data-do="back">← Back</button></div>`;
            return;
        }
        if (mode === "over") {
            const p = me();
            app.innerHTML = `<div class="screen"><div class="place">${ORD(p.place)}</div><h1>${p.place === 1 ? "🏆 Victory!" : p.place <= 4 ? "Well fought!" : "Knocked out"}</h1>
                <p>${p.place === 1 ? "Every rival beaten." : `You finished ${ORD(p.place)} of 8, after ${match.round} round${match.round === 1 ? "" : "s"}.`}</p>
                ${LOCAL ? "" : lastReward ? `<div class="won" id="won">🎁 You won ${esc(W.rewardText(lastReward))}<small>${rewardsLeft > 0 ? `${rewardsLeft} more rewarded match${rewardsLeft === 1 ? "" : "es"} today` : "That was today's last rewarded match — more tomorrow"}</small></div>` : lastReward === null ? `<div class="won none" id="won">No reward this time — today's ${W.DAILY_REWARDS} rewarded matches were used<small>More tomorrow · you can still play for fun</small></div>` : ""}
                ${playersHtml()}
                <button class="big main" data-do="start">⚔️ Play again</button><button class="big" data-do="back">← Back</button></div>`;
            return;
        }
        if (mode === "plan") {
            // each part of the screen redrawn only if it's changed — buying something doesn't redraw the board
            // (redrawing the whole screen on every tap made taps slow on a phone)
            if (app.dataset.layout !== "plan") { app.innerHTML = PLAN_PARTS.map(id => `<div class="sec" id="sec-${id}"></div>`).join(""); app.dataset.layout = "plan"; partWas = {}; }
            const parts = { top: topHtml(), players: playersHtml(), vs: vsHtml(), board: boardHtml(), traits: traitsHtml(me().board), bench: benchHtml(), info: infoHtml(), shop: shopHtml() };

    /* 📐 The board's size: as big as the screen's width allows (up to 70 px a square — bigger on a computer),

    const STAGE_ROWS = 8 - 1.05; // (the tilted board takes about this many squares of height: its 8, less what it's pulled up)
    let fitKey = "";
    function fitBoard() {
        if (mode !== "plan" && mode !== "fight") return;
        const acts = document.querySelectorAll("#app .acts"), root = document.documentElement, last = acts[acts.length - 1];
        if (!last) return;
        // (the same screen as last time: one look — worked out again only if something no longer fits; a full
        // fit measures the page several times, and doing that on every tap made taps slow on a phone)
        const key = window.innerWidth + "x" + window.innerHeight + ":" + mode;
        if (key === fitKey && last.getBoundingClientRect().bottom + window.scrollY + 10 <= window.innerHeight) return;
        fitKey = key;
        document.body.classList.toggle("compact", window.innerHeight < 720);
        const widest = Math.max(28, Math.min(70, Math.floor((Math.min(window.innerWidth, 640) - 24) / 7)));

        for (let i = 0; i < 5; i++) {
            root.style.setProperty("--cell", c + "px");
            const over = last.getBoundingClientRect().bottom + window.scrollY + 10 - window.innerHeight;
            const next = Math.max(28, Math.min(widest, Math.floor(c - over / STAGE_ROWS)));
            if (next === c || (over <= 0 && over > -STAGE_ROWS)) break;

    /* ---------------- the fight, played back ---------------- */

        const flip = !youA; // you always at the bottom
        const pos = (x, y) => (flip ? { x: W.COLS - 1 - x, y: 7 - y } : { x, y });
        const app = $("app");

            const d = document.createElement("div");

        const shoot = (from, to, magic) => { if (!els[from] || !els[to]) return; const a = centre(from), b = centre(to), s = document.createElement("div"); s.className = "shot" + (magic ? " magic" : ""); s.style.left = a.x + "px"; s.style.top = a.y + "px"; fx.appendChild(s); requestAnimationFrame(() => requestAnimationFrame(() => { s.style.left = b.x + "px"; s.style.top = b.y + "px"; })); setTimeout(() => s.remove(), 220); };

    // the board itself rather than the square under the finger.
    function cellAt(x, y) {
        let best = null, bd = Infinity;
        document.querySelectorAll("#board .cell").forEach(c => {
            const r = c.getBoundingClientRect();
            if (x < r.left || x > r.right || y < r.top || y > r.bottom) return;
            const d = Math.hypot(x - (r.left + r.right) / 2, y - (r.top + r.bottom) / 2);
            if (d < bd) { bd = d; best = c; }
        });
        return best;
    }
    // what a tap or a drop is on: a square of the board by where it touched; anything else as it is
    const pointTarget = (x, y, fallback) => {
        const at = document.elementFromPoint(x, y) || fallback;
        if (at && at.closest && at.closest("#board") && !at.closest("[data-x], [data-ex]")) return cellAt(x, y) || at;
        if (!at || !at.closest || (!at.closest("#app") && !at.closest("#sheetBg"))) return fallback;
        return at;
    };
    document.addEventListener("click", (e) => {
        if (justDragged) return;
        tap((e.clientX || e.clientY) ? pointTarget(e.clientX, e.clientY, e.target) : e.target);
    });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") { if (!$("sheetBg").hidden) closeSheet(); else if (sel) { sel = null; render(); } } });

    // for the tests
    window.WarbandDebug = { get match() { return match; }, get moves() { return moves; }, get mode() { return mode; }, get cat() { return cat; }, get runId() { return runId; }, act, fightNow, render: () => render(), skip: () => skipFight && skipFight(), fight: null };
    boot();
})();
</script>
