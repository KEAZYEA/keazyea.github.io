<!doctype html>
<html lang="en">

<head>
    <title>Tips — Keazyea's Intelligence Hub</title>
    <link rel="icon" href="images/KIH.jpg">
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        html,
        body {
            margin: 0;
            overflow-x: hidden;
        }

        .tips-search-wrap {
            max-width: 640px;
            margin: 0 auto 20px;
            padding: 0 16px;
            display: flex;
            gap: 10px;
        }

        .tips-search-input-wrap {
            position: relative;
            flex: 1;
            min-width: 0;
        }

        .tips-search-input {
            width: 100%;
            padding: 12px 36px 12px 16px;
            font-size: 1rem;
            border-radius: 10px;
            border: 1px solid #2a2a4a;
            background: #16162a;
            color: white;
            box-sizing: border-box;
        }

        .tips-search-input::placeholder {
            color: #9a9ab0;
        }

        .tips-search-clear-btn {
            display: none;
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            width: 26px;
            height: 26px;
            border: none;
            border-radius: 50%;
            background: none;
            color: #9a9ab0;
            font-size: 1rem;
            line-height: 1;
            cursor: pointer;
        }

        .tips-search-clear-btn:hover {
            background: #2a2a4a;
            color: white;
        }

        .tips-tag-select {
            flex-shrink: 0;
            padding: 12px 10px;
            font-size: 0.95rem;
            border-radius: 10px;
            border: 1px solid #2a2a4a;
            background: #16162a;
            color: white;
            box-sizing: border-box;
        }

        .tip-tag-badge {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: normal;
            color: #9a9ab0;
            background: #22223f;
            border-radius: 5px;
            padding: 2px 7px;
            flex-shrink: 0;
        }

        /* ---- GRID VIEW ---- */
        .tips-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 640px;
            margin: 0 auto;
            padding: 0 16px;
        }

        .tip-card-preview {
            background: #16162a;
            border: 1px solid #2a2a4a;
            border-radius: 12px;
            padding: 14px 20px;
            text-align: left;
            cursor: pointer;
            transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .tip-card-preview:hover {
            transform: translateY(-2px);
            border-color: #4169e1;
            background: #1c1c36;
        }

        .tip-card-preview-title {
            color: #4169e1;
            font-size: 1.05rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ---- DETAIL VIEW ---- */
        .tip-detail-wrap {
            max-width: 640px;
            margin: 0 auto;
            padding: 66px 16px 0;
        }

        body {
            margin: 0;
        }

        .back-to-tips-btn {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            height: 50px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            background: #16162a;
            border: none;
            border-bottom: 1px solid #2a2a4a;
            color: white;
            padding: 0 16px;
            cursor: pointer;
            font-size: 0.95rem;
            text-align: left;
        }

        .back-to-tips-btn:hover {
            background: #1c1c2e;
        }

        .tip-card {
            padding: 20px 24px;
            background: #16162a;
            border: 1px solid #2a2a4a;
            border-radius: 14px;
            text-align: left;
        }

        .tip-title {
            color: #4169e1;
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .tip-body {
            white-space: pre-wrap;
            color: #d0d0da;
            line-height: 1.5;
        }

        .tip-image {
            display: block;
            max-width: 100%;
            border-radius: 10px;
            margin-top: 14px;
        }

        .tips-empty {
            text-align: center;
            color: #9a9ab0;
            padding: 40px 16px;
        }

        .tips-pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            max-width: 640px;
            margin: 20px auto 0;
            padding: 0 16px;
        }

        .tips-page-btn {
            padding: 10px 18px;
            font-size: 0.9rem;
            border-radius: 10px;
            border: 1px solid #2a2a4a;
            background: #16162a;
            color: white;
            cursor: pointer;
        }

        .tips-page-btn:hover:not(:disabled) {
            border-color: #4169e1;
            background: #1c1c36;
        }

        .tips-page-btn:disabled {
            opacity: 0.4;
            cursor: default;
        }

        .tips-page-label {
            color: #9a9ab0;
            font-size: 0.85rem;
            min-width: 60px;
            text-align: center;
        }
    </style>
</head>

<body>
    <h1 id="tipsPageTitle">Tips</h1>

    <div class="tips-search-wrap" id="tipsSearchWrap" style="display:none;">
        <div class="tips-search-input-wrap">
            <input type="text" id="tipsSearchInput" class="tips-search-input" placeholder="Search tips by title...">
            <button type="button" id="tipsSearchClearBtn" class="tips-search-clear-btn" aria-label="Clear search">✕</button>
        </div>
        <select id="tipsTagSelect" class="tips-tag-select">
            <option value="all">All categories</option>
            <option value="hero">Hero</option>
            <option value="troop">Troop</option>
            <option value="bosses">Bosses</option>
            <option value="packs">Packs & Deals</option>
            <option value="formation">Formation</option>
            <option value="others">Others</option>
        </select>
    </div>

    <div class="tips-grid" id="tipsGrid"></div>

    <div class="tips-pagination" id="tipsPagination" style="display:none;">
        <button id="tipsPrevBtn" class="tips-page-btn">← Previous</button>
        <span id="tipsPageLabel" class="tips-page-label"></span>
        <button id="tipsNextBtn" class="tips-page-btn">Next →</button>
    </div>

    <div class="tip-detail-wrap" id="tipDetailWrap" style="display:none;">
    <button class="back-to-tips-btn" id="backToTipsBtn">← Back</button>
    <div id="tipsAdSlot" style="display:none; justify-content:center; margin:0 auto 16px; max-width:100%; overflow:hidden;"></div>
    <div id="tipDetailContent"></div>
</div>

    <script type="module" src="appState.js"></script>
    <script type="module">
        const PAGE_SIZE = 10;
        const TAG_LABELS = { hero: "Hero", troop: "Troop", bosses: "Bosses", packs: "Packs & Deals", formation: "Formation", others: "Others" };
        let currentPageTips = [];   // tips shown on the current page (fast path, tag="all" + no search)
        let pageCursors = [null];   // pageCursors[i] = cursor doc to fetch page i (page 0 needs none)
        let currentPage = 0;
        let hasNextPage = false;
        let allTipsCache = null;    // full tip list, fetched lazily only once a search or tag filter is actually used
        let currentFilter = "";
        let tagFilter = "all";
        let clientPage = 0;         // page index within the client-side filtered list (search/tag mode)
        let noTipsAtAll = false;    // true once page 0 comes back empty with no next page

        function isFiltering() {
            return !!currentFilter || tagFilter !== "all";
        }

        function getFilteredList() {
            let list = allTipsCache || [];
            if (tagFilter !== "all") list = list.filter(t => (t.tag || "others") === tagFilter);
            if (currentFilter) list = list.filter(t => t.title.toLowerCase().includes(currentFilter.toLowerCase()));
            return list;
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, s => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[s]));
        }

        // Escapes first (so nothing in the text can inject HTML), then turns
        // any http(s) URLs in the already-escaped text into clickable links.
        function linkifyText(str) {
            const escaped = escapeHtml(str);
            return escaped.replace(/(https?:\/\/[^\s<]+)/g, url => {
                // Trim trailing punctuation like ) . , that's likely part of
                // the sentence rather than the URL itself.
                let trailing = "";
                let clean = url;
                const match = clean.match(/[)\.,!?]+$/);
                if (match) {
                    trailing = match[0];
                    clean = clean.slice(0, -trailing.length);
                }
                return `<a href="${clean}" target="_blank" rel="noopener noreferrer" style="color:#4fc3f7; text-decoration:underline;">${clean}</a>${trailing}`;
            });
        }

        function renderGrid() {
            const grid = document.getElementById("tipsGrid");

            // While a search or tag filter is active, match against every
            // tip (fetched lazily, once) instead of just the current page —
            // otherwise a filter that only sees 10 loaded tips would miss
            // almost everything. Paginate the filtered results client-side.
            let list;
            if (isFiltering()) {
                const filtered = getFilteredList();
                list = filtered.slice(clientPage * PAGE_SIZE, clientPage * PAGE_SIZE + PAGE_SIZE);
            } else {
                list = currentPageTips;
            }

            if (!list.length) {
                grid.innerHTML = isFiltering()
                    ? '<div class="tips-empty" style="grid-column:1/-1;">No tips match your filters.</div>'
                    : '<div class="tips-empty" style="grid-column:1/-1;">No tips posted yet — check back soon!</div>';
                return;
            }

            grid.innerHTML = list.map(t => `
                <div class="tip-card-preview" data-id="${t.id}">
                    <div class="tip-card-preview-title">${t.imageUrl ? "🖼️ " : "💡 "}${escapeHtml(t.title)}</div>
                    <div style="display:flex; align-items:center; gap:8px; flex-shrink:0;">
                        <span class="tip-tag-badge">${escapeHtml(TAG_LABELS[t.tag] || TAG_LABELS.others)}</span>
                    </div>
                </div>
            `).join("");

            grid.querySelectorAll(".tip-card-preview").forEach(card => {
                card.addEventListener("click", () => {
                    const tip = list.find(t => t.id === card.getAttribute("data-id"));
                    if (tip) showTipDetail(tip);
                });
            });
        }

        function updatePaginationControls() {
            const pagination = document.getElementById("tipsPagination");

            if (isFiltering()) {
                const totalMatches = getFilteredList().length;
                if (!totalMatches) {
                    pagination.style.display = "none";
                    return;
                }
                const totalPages = Math.ceil(totalMatches / PAGE_SIZE);
                pagination.style.display = "flex";
                document.getElementById("tipsPrevBtn").disabled = clientPage === 0;
                document.getElementById("tipsNextBtn").disabled = clientPage >= totalPages - 1;
                document.getElementById("tipsPageLabel").textContent = `Page ${clientPage + 1} of ${totalPages}`;
                return;
            }

            if (currentPageTips.length === 0 && currentPage === 0 && !hasNextPage) {
                pagination.style.display = "none";
                return;
            }
            pagination.style.display = "flex";
            document.getElementById("tipsPrevBtn").disabled = currentPage === 0;
            document.getElementById("tipsNextBtn").disabled = !hasNextPage;
            document.getElementById("tipsPageLabel").textContent = `Page ${currentPage + 1}`;
        }

        async function loadPage(pageIndex) {
            document.getElementById("tipsGrid").innerHTML = '<div class="tips-empty" style="grid-column:1/-1;">⏳ Loading tips...</div>';
            document.getElementById("tipsPagination").style.display = "none";

            const { tips, lastDoc, hasMore } = await AppState.getTipsPage(PAGE_SIZE, pageCursors[pageIndex]);
            currentPageTips = tips;
            hasNextPage = hasMore;
            currentPage = pageIndex;
            if (hasMore) pageCursors[pageIndex + 1] = lastDoc;

            if (pageIndex === 0) {
                noTipsAtAll = tips.length === 0 && !hasMore;
            }
            document.getElementById("tipsSearchWrap").style.display = noTipsAtAll ? "none" : "flex";

            renderGrid();
            updatePaginationControls();
            window.scrollTo({ top: 0, left: 0, behavior: "instant" });
        }
        function showTipDetail(tip) {
            document.getElementById("tipsPageTitle").style.display = "none";
            document.getElementById("tipsGrid").style.display = "none";
            document.getElementById("tipsSearchWrap").style.display = "none";
            document.getElementById("tipsPagination").style.display = "none";
            document.getElementById("tipDetailWrap").style.display = "block";

            document.getElementById("tipDetailContent").innerHTML = `
        <div class="tip-card">
            <div class="tip-title">${escapeHtml(tip.title)}</div>
            <div class="tip-body">${linkifyText(tip.body)}</div>
            ${tip.imageUrl ? `<img class="tip-image" src="${escapeHtml(tip.imageUrl)}" alt="${escapeHtml(tip.title)}">` : ""}
        </div>
    `;
            window.scrollTo({ top: 0, left: 0, behavior: "instant" });
            AppState.maybeRefreshAd("tipsAdSlot");
        }

        function showGrid() {
            document.getElementById("tipDetailWrap").style.display = "none";
            document.getElementById("tipsPageTitle").style.display = "block";
            document.getElementById("tipsGrid").style.display = "flex";
            document.getElementById("tipsSearchWrap").style.display = noTipsAtAll ? "none" : "flex";
            renderGrid();
            updatePaginationControls();
            window.scrollTo({ top: 0, left: 0, behavior: "instant" });
        }
        document.getElementById("backToTipsBtn").addEventListener("click", showGrid);

        // Ensures the full tip list is loaded (once) before switching into
        // filtered mode — needed the first time a search or tag filter is used.
        async function ensureAllTipsCache() {
            if (allTipsCache) return;
            document.getElementById("tipsGrid").innerHTML = '<div class="tips-empty" style="grid-column:1/-1;">⏳ Loading...</div>';
            allTipsCache = await AppState.getTips();
        }

        const tipsSearchInput = document.getElementById("tipsSearchInput");
        const tipsSearchClearBtn = document.getElementById("tipsSearchClearBtn");

        tipsSearchInput.addEventListener("input", async (e) => {
            AppState.maybeRefreshAd("tipsAdSlot");
            currentFilter = e.target.value.trim();
            tipsSearchClearBtn.style.display = currentFilter ? "block" : "none";
            clientPage = 0;
            if (isFiltering()) await ensureAllTipsCache();
            renderGrid();
            updatePaginationControls();
        });

        tipsSearchClearBtn.addEventListener("click", () => {
            tipsSearchInput.value = "";
            tipsSearchInput.focus();
            tipsSearchClearBtn.style.display = "none";
            currentFilter = "";
            clientPage = 0;
            renderGrid();
            updatePaginationControls();
        });

        document.getElementById("tipsTagSelect").addEventListener("change", async (e) => {
            AppState.maybeRefreshAd("tipsAdSlot");
            tagFilter = e.target.value;
            clientPage = 0;
            if (isFiltering()) await ensureAllTipsCache();
            renderGrid();
            updatePaginationControls();
        });

        document.getElementById("tipsNextBtn").addEventListener("click", () => {
            if (isFiltering()) {
                const totalPages = Math.ceil(getFilteredList().length / PAGE_SIZE);
                if (clientPage < totalPages - 1) {
                    clientPage++;
                    renderGrid();
                    updatePaginationControls();
                    window.scrollTo({ top: 0, left: 0, behavior: "instant" });
                }
            } else if (hasNextPage) {
                loadPage(currentPage + 1);
            }
        });
        document.getElementById("tipsPrevBtn").addEventListener("click", () => {
            if (isFiltering()) {
                if (clientPage > 0) {
                    clientPage--;
                    renderGrid();
                    updatePaginationControls();
                    window.scrollTo({ top: 0, left: 0, behavior: "instant" });
                }
            } else if (currentPage > 0) {
                loadPage(currentPage - 1);
            }
        });

        async function init() {
            AppState.waitForAuthReady().then(() => AppState.loadAdsterraAdsIfAllowed());

            const params = new URLSearchParams(window.location.search);
            const requestedTipId = params.get("tipId");
            const tipPromise = requestedTipId ? AppState.getTip(requestedTipId) : Promise.resolve(null);

            await loadPage(0);

            const tip = await tipPromise;
            if (tip) showTipDetail(tip);
        }

        init();

        // Ad recheck on auth change + periodic safety net — mirrors the
        // pattern used on promo.html/social.html/store.html. Safe to call
        // even while the grid view (not detail view) is showing: the ad
        // slot's parent (#tipDetailWrap) is separately hidden via
        // display:none in that case, so forcing the ad slot itself visible
        // has no effect until a tip is actually opened.
        AppState.waitForAuthReady().then(() => AppState.maybeRefreshAd("tipsAdSlot"));
        AppState.onAuthChange(() => AppState.maybeRefreshAd("tipsAdSlot"));
        setInterval(() => AppState.maybeRefreshAd("tipsAdSlot"), 25000);
    </script>
</body>

</html>
